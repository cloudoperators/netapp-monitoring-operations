{{- if ne (.Values.prometheusRules.ruleGroups.netappLunAlerts | toString) "false" }}
groups:
  - name: lun_offline_final
    interval: 1m
    rules:
      - record: lun_offline_trigger
        expr: |
          max by (netapp_cluster, node, lun) (lun_labels{state!="online"}) == 1
      - record: lun_offline_ok_trigger
        expr: |
          max by (netapp_cluster, node, lun) (lun_labels{state="online"}) == 1
      - record: lun_offline_persistent
        expr: |
          (
            lun_offline_trigger
            or
            lun_offline_persistent
          )
          unless
          lun_offline_ok_trigger

  - name: lun_offline_alerts
    rules:
      - alert: LunOffline
        expr: lun_offline_persistent == 1
        for: 2m
        labels:
          severity: warning
          support_group: {{ dig "support_group" "storage" (.Values.prometheusRules.commonLabels | default dict) }}
          team: {{ dig "team" "sci-storage-ops" (.Values.prometheusRules.commonLabels | default dict) }}
          component: netapp_lun
        annotations:
          summary: '🟡 LUN {{ "{{ $labels.lun }}" }} is offline'
          description: |
            'LUN {{ "{{ $labels.lun }}" }} on node {{ "{{ $labels.node }}" }}, cluster {{ "{{ $labels.netapp_cluster }}" }} is offline.
            Cluster: {{ "{{ $labels.netapp_cluster }}" }}, Node: {{ "{{ $labels.node }}" }} 
            Datacenter: {{ "{{ $labels.datacenter }}" }}, LOB: {{ "{{ $labels.lob }}" }},  Service: {{ "{{ $labels.Service }}" }}'
 {{- else }}
 groups: []
 {{- end }}
 