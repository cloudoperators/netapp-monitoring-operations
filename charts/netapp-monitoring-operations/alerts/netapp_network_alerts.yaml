groups:
  - name: interface_link_errors_final
    interval: 1m
    rules:
      - record: interface_link_errors_trigger
        expr: |
          max by (netapp_cluster, node, nic) (max_over_time (nic_rx_errors[5m]) or max_over_time (nic_tx_errors[5m])) > 0
      - record: interface_link_errors_ok_trigger
        expr: |
          max by (netapp_cluster, node, nic) (max_over_time (nic_rx_errors[5m]) and max_over_time (nic_tx_errors[5m])) == 0
      - record: interface_link_errors_persistent
        expr: |
          (
            interface_link_errors_trigger
            or
            interface_link_errors_persistent
          )
          unless
          interface_link_errors_ok_trigger

  - name: interface_link_errors_alerts
    rules:
      - alert: InterfaceLinkErrorsAlert
        expr: interface_link_errors_persistent == 1
        for: 2m
        labels:
          severity: critical
          support_group: storage
          team: sci-storage
          component: netapp_network
        annotations:
          summary: '🔴 Interface link errors on {{ "{{ $labels.netapp_cluster }}" }}'
          description: |
            'Interface link errors on {{ "{{ $labels.netapp_cluster }}" }}, node {{ "{{ $labels.node }}" }}, port {{ "{{ $labels.nic }}" }}.
            Cluster: {{ "{{ $labels.netapp_cluster }}" }}, Node: {{ "{{ $labels.node }}" }} 
            Datacenter: {{ "{{ $labels.datacenter }}" }}, LOB: {{ "{{ $labels.lob }}" }},  Service: {{ "{{ $labels.Service }}" }}'

  - name: lif_not_at_home_final
    interval: 1m
    rules:
      - record: lif_not_at_home_trigger
        expr: |
          max by (netapp_cluster, node, lif) (lif_labels{is_home="false"}) == 1
      - record: lif_at_home_trigger
        expr: |
          max by (netapp_cluster, node, lif) (lif_labels{is_home="true"}) == 1
      - record: lif_not_at_home_persistent
        expr: |
          (
            lif_not_at_home_trigger
            or
            lif_not_at_home_persistent
          )
          unless
          lif_at_home_trigger

  - name: lif_not_at_home_alerts
    rules:
      - alert: LifNotAtHomeAlert
        expr: lif_not_at_home_persistent == 1
        for: 2m
        labels:
          severity: critical
          support_group: storage
          team: sci-storage
          component: netapp_network
        annotations:
          summary: '🔴 LIF {{ "{{ $labels.lif }}" }} is not at home'
          description: >
            'LIF {{ "{{ $labels.lif }}" }} on node {{ "{{ $labels.node }}" }},
            cluster {{ "{{ $labels.netapp_cluster }}" }} is not at home.'

  - name: ic_link_down
    rules:
      - alert: ICInterconnectLinkDown
        expr: (ems_events{message="ic.HAInterconnectLinkDown"})
        for: 5m
        labels:
          severity: warning
          support_group: storage
          team: sci-storage
          component: netapp_network
        annotations:
          summary: '🟡 LIF {{ "{{ $labels.lif }}" }} is not at home'
          description: |
            'LIF {{ "{{ $labels.lif }}" }} on node {{ "{{ $labels.node }}" }}, cluster {{ "{{ $labels.netapp_cluster }}" }} is not at home.
            Cluster: {{ "{{ $labels.netapp_cluster }}" }}, Node: {{ "{{ $labels.node }}" }} 
            Datacenter: {{ "{{ $labels.datacenter }}" }}, LOB: {{ "{{ $labels.lob }}" }},  Service: {{ "{{ $labels.Service }}" }}'

  - name: vifmgr_cluscheck_lifdown_final
    interval: 1m
    rules:
      - record: vifmgr_cluscheck_lifdown_trigger
        expr: |
          max by (netapp_cluster, node, datacenter, cluster_uuid, lif_name, name) (
            max_over_time(ems_events{message="vifmgr.cluscheck.lifdown"}[2m])
          )
      - record: vifmgr_cluscheck_lifup_trigger
        expr: |
          max by (netapp_cluster, node, datacenter, cluster_uuid, lif_name, name) (
            max_over_time(ems_events{message="vifmgr.cluscheck.lifup"}[2m])
          )
      - record: vifmgr_cluscheck_lifdown_persistent
        expr: |
          (
            vifmgr_cluscheck_lifdown_trigger
            or
            vifmgr_cluscheck_lifdown_persistent
          )
          unless
          vifmgr_cluscheck_lifup_trigger

  - name: vifmgr_cluscheck_lifdown_alerts
    rules:
      - alert: VifmgrCluscheckLifdown
        expr: vifmgr_cluscheck_lifdown_persistent == 1
        for: 2m
        labels:
          severity: critical
          support_group: storage
          team: sci-storage
          component: netapp_network
        annotations:
          summary: '🔴 LIF {{ "{{ $labels.lif_name }}" }} is down'
          description: |
            'The logical interface (LIF) {{ "{{ $labels.lif_name }}" }} on node {{ "{{ $labels.name }}" }} (Cluster: {{ "{{ $labels.netapp_cluster }}" }}) is 
            down. The alert resolves when the event "vifmgr.cluscheck.lifup" is detected.
            Cluster: {{ "{{ $labels.netapp_cluster }}" }}, Node: {{ "{{ $labels.node }}" }} 
            Datacenter: {{ "{{ $labels.datacenter }}" }}, LOB: {{ "{{ $labels.lob }}" }},  Service: {{ "{{ $labels.Service }}" }}'

  - name: vifmgr_portdown_final
    interval: 1m
    rules:
      - record: vifmgr_portdown_trigger
        expr: |
          max by (netapp_cluster, node, datacenter, cluster_uuid, nodename, portname) (
            max_over_time(ems_events{message="vifmgr.portdown"}[2m])
          )
      - record: vifmgr_portup_trigger
        expr: |
          max by (netapp_cluster, node, datacenter, cluster_uuid, nodename, portname) (
            max_over_time(ems_events{message="vifmgr.portup"}[2m])
          )
      - record: vifmgr_portdown_persistent
        expr: |
          (
            vifmgr_portdown_trigger
            or
            vifmgr_portdown_persistent
          )
          unless
          vifmgr_portup_trigger

  - name: vifmgr_portdown_alerts
    rules:
      - alert: VifmgrPortdown
        expr: vifmgr_portdown_persistent == 1
        for: 2m
        labels:
          severity: critical
          support_group: storage
          team: sci-storage
          component: netapp_network
        annotations:
          summary: '🔴 Port {{ "{{ $labels.portname }}" }} on node {{ "{{ $labels.nodename }}" }} is down'
          description: |
            'Network port {{ "{{ $labels.portname }}" }} on node {{ "{{ $labels.nodename }}" }} (Cluster: {{ "{{ $labels.netapp_cluster }}" }}) is down. 
            The alert resolves when the event "vifmgr.portup" is detected.
            Cluster: {{ "{{ $labels.netapp_cluster }}" }}, Node: {{ "{{ $labels.node }}" }} 
            Datacenter: {{ "{{ $labels.datacenter }}" }}, LOB: {{ "{{ $labels.lob }}" }},  Service: {{ "{{ $labels.Service }}" }}'

  - name: vifmgr_lifs_overcapacity_final
    interval: 1m
    rules:
      - record: vifmgr_lifs_overcapacity_trigger
        expr: |
          max by (netapp_cluster, node, datacenter, cluster_uuid, name) (
            max_over_time(ems_events{message="vifmgr.lifs.overcapacity"}[2m])
          )
      - record: vifmgr_lifdeleted_byadmin_trigger
        expr: |
          max by (netapp_cluster, node, datacenter, cluster_uuid, name) (
            max_over_time(ems_events{message="vifmgr.lifdeleted.byadmin"}[2m])
          )
      - record: vifmgr_lifs_overcapacity_persistent
        expr: |
          (
            vifmgr_lifs_overcapacity_trigger
            or
            vifmgr_lifs_overcapacity_persistent
          )
          unless
          vifmgr_lifdeleted_byadmin_trigger

  - name: vifmgr_lifs_overcapacity_alerts
    rules:
      - alert: VifmgrLifsOvercapacity
        expr: vifmgr_lifs_overcapacity_persistent == 1
        for: 2m
        labels:
          severity: warning
          support_group: storage
          team: sci-storage
          component: netapp_network
        annotations:
          summary: '🟡 LIFs are overcapacity on {{ "{{ $labels.node }}" }}'
          description: |
            'The number of logical interfaces (LIFs) on node {{ "{{ $labels.node }}" }} has exceeded the recommended limit. 
            The alert resolves when the event "vifmgr.lifdeleted.byadmin" is detected.
            Cluster: {{ "{{ $labels.netapp_cluster }}" }}, Node: {{ "{{ $labels.node }}" }} 
            Datacenter: {{ "{{ $labels.datacenter }}" }}, LOB: {{ "{{ $labels.lob }}" }},  Service: {{ "{{ $labels.Service }}" }}'

  - name: vifmgr_lifdown_noports_final
    interval: 1m
    rules:
      - record: vifmgr_lifdown_noports_trigger
        expr: |
          max by (netapp_cluster, node, datacenter, cluster_uuid, vifname) (
            max_over_time(ems_events{message="vifmgr.lifdown.noports"}[2m])
          )
      - record: vifmgr_lifbeinghosted_trigger
        expr: |
          max by (netapp_cluster, node, datacenter, cluster_uuid, vifname) (
            max_over_time(ems_events{message="vifmgr.lifbeinghosted"}[2m])
          )
      - record: vifmgr_lifdown_noports_persistent
        expr: |
          (
            vifmgr_lifdown_noports_trigger
            or
            vifmgr_lifdown_noports_persistent
          )
          unless
          vifmgr_lifbeinghosted_trigger

  - name: vifmgr_lifdown_noports_alerts
    rules:
      - alert: VifmgrLifdownNoports
        expr: vifmgr_lifdown_noports_persistent == 1
        for: 2m
        labels:
          severity: critical
          support_group: storage
          team: sci-storage
          component: netapp_network
        annotations:
          summary: '🔴 LIF {{ "{{ $labels.vifname }}" }} is down (no available ports)'
          description: >
            'The logical interface (LIF) {{ "{{ $labels.vifname }}" }} on node 
            {{ "{{ $labels.node }}" }} is down because no suitable failover ports are 
            available. The alert resolves when the LIF is hosted again 
            ("vifmgr.lifbeinghosted").'


  - name: vifmgr_lifs_overcapacity_alerts
    rules:
      - alert: VifmgrLifsOvercapacity
        expr: vifmgr_lifs_overcapacity_persistent == 1
        for: 2m
        labels:
          severity: warning
          support_group: storage
          team: sci-storage
          component: netapp_network
        annotations:
          summary: '🟡 LIFs are overcapacity on {{ "{{ $labels.node }}" }}'
          description: >
            'The number of logical interfaces (LIFs) on node {{ "{{ $labels.node }}" }} 
            has exceeded the recommended limit. The alert resolves when the event 
            "vifmgr.lifdeleted.byadmin" is detected.'

  - name: nic_fatal_error
    rules:
      - alert: NWInterfaceFatalErrorDriver
        expr: (ems_events{message="netif.fatal.err"})
        for: 5m
        labels:
          severity: critical
          support_group: storage
          team: sci-storage
          component: netapp_network
        annotations:
          summary: '🔴 NIC driver fatal error'
          description: |
            'NIC driver fatal error in slot {{ "{{ $labels.slot }}" }}
            Cluster: {{ "{{ $labels.netapp_cluster }}" }}, Node: {{ "{{ $labels.node }}" }} 
            Datacenter: {{ "{{ $labels.datacenter }}" }}, LOB: {{ "{{ $labels.lob }}" }},  Service: {{ "{{ $labels.Service }}" }}'

  - name: lif_overcapacity
    rules:
      - alert: OverprovisioningOfDataLIF
        expr: (ems_events{message="vifmgr.lifs.overcapacity"})
        for: 5m
        labels:
          severity: warning
          support_group: storage
          team: sci-storage
          component: netapp_network
        annotations:
          summary: '🟡 LIF over-provisioned'
          description: |
            'Over-provisioned failover targets: {{ "{{" }} $labels.overamount {{ "}}" }} LIFs may go "down" on node failure
            Cluster: {{ "{{ $labels.netapp_cluster }}" }}, Node: {{ "{{ $labels.node }}" }} 
            Datacenter: {{ "{{ $labels.datacenter }}" }}, LOB: {{ "{{ $labels.lob }}" }},  Service: {{ "{{ $labels.Service }}" }}'

  - name: netif_negotiation_failure
    rules:
      - alert: NeworkInterfaceNegotiationFailure
        expr: (ems_events{message="netif.autoNegFailed"})
        for: 5m
        labels:
          severity: warning
          support_group: storage
          team: sci-storage
          component: netapp_network
        annotations:
          summary: '🟡 Network interface autonegotiation failed'
          description: |
            'Autonegotiation failed, interface {{ "{{ $labels.ifName }}" }} operating at {{ "{{ $labels.speed }}" }} Mbps half-duplex
            Cluster: {{ "{{ $labels.netapp_cluster }}" }}, Node: {{ "{{ $labels.node }}" }} 
            Datacenter: {{ "{{ $labels.datacenter }}" }}, LOB: {{ "{{ $labels.lob }}" }},  Service: {{ "{{ $labels.Service }}" }}'

  - name: netif_bad_oversize_packet
    rules:
      - alert: NeworkInterfaceBadOversizePacket
        expr: (ems_events{message="netif.badOversizePacket"})
        for: 5m
        labels:
          severity: warning
          support_group: storage
          team: sci-storage
          component: netapp_network
        annotations:
          summary: '🟡 Bad oversize packet received on network interface'
          description: |
            'Bad oversize packet received on network interface {{ "{{ $labels.ifName }}" }}.
            Check for NIC receive errors (CRC, runts, fragments). Might indicate a bad switch port.
            Cluster: {{ "{{ $labels.netapp_cluster }}" }}, Node: {{ "{{ $labels.node }}" }} 
            Datacenter: {{ "{{ $labels.datacenter }}" }}, LOB: {{ "{{ $labels.lob }}" }},  Service: {{ "{{ $labels.Service }}" }}'

  - name: netif_max_cpr_reached
    rules:
      - alert: NeworkInterfaceMaxCPRReached
        expr: (ems_events{message="netif.cprMaxEventsReached"})
        for: 5m
        labels:
          severity: warning
          support_group: storage
          team: sci-storage
          component: netapp_network
        annotations:
          summary: '🟡 Network interface max CPR reached'
          description: |
            'Replace hardware — maximum number of CPR Events (core PCI resiliency) since boot has occurred on network interface {{ "{{ $labels.ifName }}" }}.
            Cluster: {{ "{{ $labels.netapp_cluster }}" }}, Node: {{ "{{ $labels.node }}" }} 
            Datacenter: {{ "{{ $labels.datacenter }}" }}, LOB: {{ "{{ $labels.lob }}" }},  Service: {{ "{{ $labels.Service }}" }}'

  - name: netif_read_eeprom_failed
    rules:
      - alert: NeworkInterfaceReadEEPROMFailed
        expr: (ems_events{message="netif.eepromReadFailed"})
        for: 5m
        labels:
          severity: warning
          support_group: storage
          team: sci-storage
          component: netapp_network
        annotations:
          summary: '🟡 Failure in reading EEPROM for network interface {{ "{{ $labels.ifName }}" }}'
          description: |
            'This message occurs when there is a failure in reading the electronically erasable programmable read-only memory (EEPROM) for a network interface. The interface is not initialized.
            Rebooting the system might clear the problem. The problem might be caused by a software bug and should be reported to NetApp technical support.
            Cluster: {{ "{{ $labels.netapp_cluster }}" }}, Node: {{ "{{ $labels.node }}" }} 
            Datacenter: {{ "{{ $labels.datacenter }}" }}, LOB: {{ "{{ $labels.lob }}" }},  Service: {{ "{{ $labels.Service }}" }}'

  - name: netif_hang_detected
    rules:
      - alert: NeworkInterfaceHangDetected
        expr: (ems_events{message="netif.hangDetected"})
        for: 5m
        labels:
          severity: critical
          support_group: storage
          team: sci-storage
          component: netapp_network
        annotations:
          summary: '🔴 Network interface hung {{ "{{ $labels.ifName }}" }}'
          description: |
            'Network interface {{ "{{ $labels.ifName }}" }} hung ({{ "{{ $labels.hangType }}" }}). {{ "{{ $labels.recoveryAction }}" }}. Driver: {{ "{{ $labels.driver }}" }}
            Cluster: {{ "{{ $labels.netapp_cluster }}" }}, Node: {{ "{{ $labels.node }}" }} 
            Datacenter: {{ "{{ $labels.datacenter }}" }}, LOB: {{ "{{ $labels.lob }}" }},  Service: {{ "{{ $labels.Service }}" }}'

  - name: netif_init_failed
    rules:
      - alert: NeworkInterfaceInitFailed
        expr: (ems_events{message="netif.init.failed"})
        for: 5m
        labels:
          severity: warning
          support_group: storage
          team: sci-storage
          component: netapp_network
        annotations:
          summary: '🔴 Initialization of network interface {{ "{{ $labels.ifName }}" }} failed'
          description: |
            'Initialization of network interface {{ "{{ $labels.ifName }}" }} failed due to unexpected software error {{ "{{ $labels.module }}" }}: {{ "{{ $labels.error }}" }}
            Cluster: {{ "{{ $labels.netapp_cluster }}" }}, Node: {{ "{{ $labels.node }}" }} 
            Datacenter: {{ "{{ $labels.datacenter }}" }}, LOB: {{ "{{ $labels.lob }}" }},  Service: {{ "{{ $labels.Service }}" }}'

  - name: netif_link_errors
    rules:
      - alert: NeworkInterfaceLinkErrors
        expr: (ems_events{message="netif.linkErrors"})
        for: 5m
        labels:
          severity: warning
          support_group: storage
          team: sci-storage
          component: netapp_network
        annotations:
          summary: '🟡 Excessive link errors on network interface {{ "{{ $labels.ifName }}" }}'
          description: |
            'Excessive link errors on network interface {{ "{{ $labels.ifName }}" }}. Might indicate a bad cable, switch port, or NIC, or that a cable connector is not fully inserted in a socket. On a 10/100 port, might indicate a duplex mismatch.
            Cluster: {{ "{{ $labels.netapp_cluster }}" }}, Node: {{ "{{ $labels.node }}" }} 
            Datacenter: {{ "{{ $labels.datacenter }}" }}, LOB: {{ "{{ $labels.lob }}" }},  Service: {{ "{{ $labels.Service }}" }}'

  - name: netif_nic_not_supported
    rules:
      - alert: NeworkInterfaceNICNotSupported
        expr: (ems_events{message="netif.nicNotSupported"})
        for: 5m
        labels:
          severity: warning
          support_group: storage
          team: sci-storage
          component: netapp_network
        annotations:
          summary: '🟡 The NIC in slot {{ "{{ $labels.slot }}" }} is not supported'
          description: |
            'The NIC in slot {{ "{{ $labels.slot }}" }} is not supported. The {{ "{{ $labels.reason }}" }} is not supported.
            Cluster: {{ "{{ $labels.netapp_cluster }}" }}, Node: {{ "{{ $labels.node }}" }} 
            Datacenter: {{ "{{ $labels.datacenter }}" }}, LOB: {{ "{{ $labels.lob }}" }},  Service: {{ "{{ $labels.Service }}" }}'

  - name: netif_overtemp_error
    rules:
      - alert: NeworkInterfaceOvertempError
        expr: (ems_events{message="netif.overTempError"})
        for: 5m
        labels:
          severity: warning
          support_group: storage
          team: sci-storage
          component: netapp_network
        annotations:
          summary: '🟡 Network port {{ "{{ $labels.slot }}" }} is over temperature'
          description: |
            'Network port {{ "{{ $labels.slot }}" }} is over temperature:. Ensure adequate cooling and ventilation is available. If that does not resolve the issue, replace the failed card.
            Cluster: {{ "{{ $labels.netapp_cluster }}" }}, Node: {{ "{{ $labels.node }}" }} 
            Datacenter: {{ "{{ $labels.datacenter }}" }}, LOB: {{ "{{ $labels.lob }}" }},  Service: {{ "{{ $labels.Service }}" }}'

  - name: netif_phy_not_read_error
    rules:
      - alert: NeworkInterfacePHYNotReadError
        expr: (ems_events{message="netif.phyNotRead"})
        for: 5m
        labels:
          severity: warning
          support_group: storage
          team: sci-storage
          component: netapp_network
        annotations:
          summary: '🟡 Cannot read PHY for network interface {{ "{{ $labels.ifName }}" }}'
          description: |
            'Cannot read PHY for network interface {{ "{{ $labels.ifName }}" }}.
            If the link does not come up, power-cycle (not just reboot) the system. If the link still does not come up, replace the motherboard or network interface card, depending on the location of the interface.
            Cluster: {{ "{{ $labels.netapp_cluster }}" }}, Node: {{ "{{ $labels.node }}" }} 
            Datacenter: {{ "{{ $labels.datacenter }}" }}, LOB: {{ "{{ $labels.lob }}" }},  Service: {{ "{{ $labels.Service }}" }}'

  - name: netif_phy_operation_failed
    rules:
      - alert: NeworkInterfacePHYOperationFailed
        expr: (ems_events{message="netif.phyOperationFailed"})
        for: 5m
        labels:
          severity: warning
          support_group: storage
          team: sci-storage
          component: netapp_network
        annotations:
          summary: '🟡 Failure in reading or writing PHY for network interface {{ "{{ $labels.ifName }}" }}'
          description: |
            'Failure in reading or writing PHY for network interface {{ "{{ $labels.ifName }}" }}. 
            This might be caused by a software bug. If there are problems with the interface after seeing this message, replace the component associated with the network interface (PCIe card or controller motherboard). If the problem persistis, contact NetApp technical support.
            Cluster: {{ "{{ $labels.netapp_cluster }}" }}, Node: {{ "{{ $labels.node }}" }} 
            Datacenter: {{ "{{ $labels.datacenter }}" }}, LOB: {{ "{{ $labels.lob }}" }},  Service: {{ "{{ $labels.Service }}" }}'

  - name: netif_speed_not_supported
    rules:
      - alert: NeworkInterfaceSpeedNotSupported
        expr: (ems_events{message="netif.speedNotSupported"})
        for: 5m
        labels:
          severity: warning
          support_group: storage
          team: sci-storage
          component: netapp_network
        annotations:
          summary: '🟡 Network interface {{ "{{ $labels.ifName }}" }} speed not supported.'
          description: |
            'Autonegotiation on network interface {{ "{{ $labels.ifName }}" }} resolved to speed {{ "{{ $labels.speed }}" }}. This speed is not supported.
            Connect to 1 or 10 gigabits per second (Gbps) switch port.
            Cluster: {{ "{{ $labels.netapp_cluster }}" }}, Node: {{ "{{ $labels.node }}" }} 
            Datacenter: {{ "{{ $labels.datacenter }}" }}, LOB: {{ "{{ $labels.lob }}" }},  Service: {{ "{{ $labels.Service }}" }}'

  - name: netif_tcp_bad_checksum
    rules:
      - alert: NeworkInterfaceTCPBadChecksum
        expr: (ems_events{message="netif.tcp.conn.bad.checksum"})
        for: 5m
        labels:
          severity: warning
          support_group: storage
          team: sci-storage
          component: netapp_network
        annotations:
          summary: '🟡 TCP packet with bad checksum detected on port {{ "{{ $labels.local_port }}" }}.'
          description: |
            'TCP packet with bad checksum detected on port {{ "{{ $labels.local_port }}" }}. The packet arrived on connection with source address {{ "{{ $labels.source_address }}" }} and destination address {{ "{{ $labels.destination_address }}" }}.
            If experiencing network issues, corrupted TCP packets might be an issue. Check the network components along the path of TCP connection.
            Cluster: {{ "{{ $labels.netapp_cluster }}" }}, Node: {{ "{{ $labels.node }}" }} 
            Datacenter: {{ "{{ $labels.datacenter }}" }}, LOB: {{ "{{ $labels.lob }}" }},  Service: {{ "{{ $labels.Service }}" }}'

  - name: netif_uncorr_ecc_error
    rules:
      - alert: NeworkInterfaceUncorrECCError
        expr: (ems_events{message="netif.uncorEccError"})
        for: 5m
        labels:
          severity: critical
          support_group: storage
          team: sci-storage
          component: netapp_network
        annotations:
          summary: '🔴 Unrecoverable ECC error on network interface {{ "{{ $labels.ifName }}" }}.'
          description: |
            'Unrecoverable ECC error on network interface {{ "{{ $labels.ifName }}" }}.
            Reboot the controller. If the problem persists, replace the component associated with the network interface (PCIe card or controller motherboard). If the problem persists, contact NetApp technical support.
            Cluster: {{ "{{ $labels.netapp_cluster }}" }}, Node: {{ "{{ $labels.node }}" }} 
            Datacenter: {{ "{{ $labels.datacenter }}" }}, LOB: {{ "{{ $labels.lob }}" }},  Service: {{ "{{ $labels.Service }}" }}'

  - name: node_low_network_mbuf
    rules:
      - alert: NodeLowNetworkMbuf
        expr: (ems_events{message="nodewatchdog.gfc.too.long"})
        for: 5m
        labels:
          severity: warning
          support_group: storage
          team: sci-storage
          component: netapp_network
        annotations:
          summary: '🟡 Networking buffer depletion detected.'
          description: |
            'Networking buffer depletion detected. Consumption exceeded {{ "{{ $labels.enter_percentage }}" }}% in use and did not recede to {{ "{{ $labels.exit_percentage }}" }}% for {{ "{{ $labels.duration }}" }} seconds.
            If CLI commands are responding slowly or clients are timing out, reboot the node using the "reboot -node [node] -dump true" option. Also call the support team to investigate further, because this is an abnormal circumstance that might recur if not addressed. Contact NetApp technical support.
            Cluster: {{ "{{ $labels.netapp_cluster }}" }}, Node: {{ "{{ $labels.node }}" }} 
            Datacenter: {{ "{{ $labels.datacenter }}" }}, LOB: {{ "{{ $labels.lob }}" }},  Service: {{ "{{ $labels.Service }}" }}'

  - name: vifmgr_db_check_error
    rules:
      - alert: VIFMgrDBCheckError
        expr: (ems_events{message="vifmgr.dbase.checkerror"})
        for: 5m
        labels:
          severity: warning
          support_group: storage
          team: sci-storage
          component: netapp_network
        annotations:
          summary: '🟡 VIFmgr DataBase Check error.'
          description: |
            'VIFMgr experienced an error verifying cluster database consistency. Some LIFs might not be hosted properly as a result.
            Contact NetApp technical support and reference the "vifmgr.dbase.checkerror" error.
            Cluster: {{ "{{ $labels.netapp_cluster }}" }}, Node: {{ "{{ $labels.node }}" }} 
            Datacenter: {{ "{{ $labels.datacenter }}" }}, LOB: {{ "{{ $labels.lob }}" }},  Service: {{ "{{ $labels.Service }}" }}'

  - name: vifmgr_lif_invalid_port
    rules:
      - alert: VIFMgrLIFInvalidPort
        expr: (ems_events{message="vifmgr.lif.invalidPort"})
        for: 5m
        labels:
          severity: warning
          support_group: storage
          team: sci-storage
          component: netapp_network
        annotations:
          summary: '🟡 VIFmgr LIF invalid port.'
          description: |
            'LIF {{ "{{ $labels.lif }}" }} has a home port identifer or current port identifier that is not present in RDB.
            Use the command in advanced mode "network interface show" making sure to specify the parameter -numeric-id with the identifier specified in the message. With the LIF name and vserver from the output of the previous command, use the "network interface modify" command to set the home port and current port to ports that are displayed by the "network ports show" command.
            Cluster: {{ "{{ $labels.netapp_cluster }}" }}, Node: {{ "{{ $labels.node }}" }} 
            Datacenter: {{ "{{ $labels.datacenter }}" }}, LOB: {{ "{{ $labels.lob }}" }},  Service: {{ "{{ $labels.Service }}" }}'

  - name: vifmgr_lif_out_of_sync
    rules:
      - alert: VIFMgrLIFOutOfSync
        expr: (ems_events{message="vifmgr.lifIdOutOfSync"})
        for: 5m
        labels:
          severity: warning
          support_group: storage
          team: sci-storage
          component: netapp_network
        annotations:
          summary: '🟡 VIFmgr LIF out of sync.'
          description: |
            'LIF {{ "{{ $labels.vifname }}" }} with ID {{ "{{ $labels.vifid }}" }} (on virtual server {{ "{{ $labels.vsrvid }}" }}), IP address {{ "{{ $labels.vifip }}" }}, is configured in the VIFMgr but is not visible in the user interface.
            Using information from the message, use the "network interface ids create" diag privilege command to create the ID.
            Cluster: {{ "{{ $labels.netapp_cluster }}" }}, Node: {{ "{{ $labels.node }}" }} 
            Datacenter: {{ "{{ $labels.datacenter }}" }}, LOB: {{ "{{ $labels.lob }}" }},  Service: {{ "{{ $labels.Service }}" }}'

  - name: vifmgr_lif_on_degraded_port
    rules:
      - alert: VIFMgrLIFOnDegradedPort
        expr: (ems_events{message="vifmgr.lifOnDegPort.noPorts"})
        for: 5m
        labels:
          severity: warning
          support_group: storage
          team: sci-storage
          component: netapp_network
        annotations:
          summary: '🟡 VIFmgr LIF on degraded port.'
          description: |
            'LIF {{ "{{ $labels.vifname }}" }} on virtual server {{ "{{ $labels.vsrvid }}" }}, IP address {{ "{{ $labels.vifip }}" }}is currently hosted on node {{ "{{ $labels.host_node }}" }}, port {{ "{{ $labels.host_port }}" }}, whose health status is degraded.
            Add ports to the broadcast domain or failover group used by the affected LIF. Use the "network interface show -failover" command to review the currently assigned failover targets for each LIF.
            Cluster: {{ "{{ $labels.netapp_cluster }}" }}, Node: {{ "{{ $labels.node }}" }} 
            Datacenter: {{ "{{ $labels.datacenter }}" }}, LOB: {{ "{{ $labels.lob }}" }},  Service: {{ "{{ $labels.Service }}" }}'

  - name: vifmgr_port_owner_error
    rules:
      - alert: VIFMgrPortOwnerError
        expr: (ems_events{message="vifmgr.portowner.err"})
        for: 5m
        labels:
          severity: warning
          support_group: storage
          team: sci-storage
          component: netapp_network
        annotations:
          summary: '🟡 Node {{ "{{ $label.nodename }}" }} port {{ "{{ $labels.portname }}" }} has an invalid port role type.'
          description: |
            'Node {{ "{{ $label.nodename }}" }} port {{ "{{ $labels.portname }}" }} has an invalid port role type. Only node-mgmt network ports can be assigned to use a different driver.
            Remove any ports from the bootarg.bsdportname LOADER variable that are of a role other than node-mgmt by resetting the bootarg.bsdportname under the LOADER prompt: LOADER> setenv bootarg.bsdportname "port-name (node-mgmt port only)" Then reboot the node.
            Cluster: {{ "{{ $labels.netapp_cluster }}" }}, Node: {{ "{{ $labels.node }}" }} 
            Datacenter: {{ "{{ $labels.datacenter }}" }}, LOB: {{ "{{ $labels.lob }}" }},  Service: {{ "{{ $labels.Service }}" }}'

  - name: vifmgr_port_speed_error
    rules:
      - alert: VIFMgrPortSpeedError
        expr: (ems_events{message="vifmgr.portspeed.err"})
        for: 5m
        labels:
          severity: warning
          support_group: storage
          team: sci-storage
          component: netapp_network
        annotations:
          summary: '🟡 Node {{ "{{ $label.nodename }}" }} port {{ "{{ $labels.portname }}" }} is reporting a speed {{ "{{ $labels.portspeed }}" }} that is not supported.'
          description: |
            'Node {{ "{{ $label.nodename }}" }} port {{ "{{ $labels.portname }}" }} is reporting a speed {{ "{{ $labels.portspeed }}" }} that is not supported.
            Ensure that the affected network port is connected to a switch that uses a link speed supported by this node. If necessary, adjust the switch configuration to assign a lower speed.
            Cluster: {{ "{{ $labels.netapp_cluster }}" }}, Node: {{ "{{ $labels.node }}" }} 
            Datacenter: {{ "{{ $labels.datacenter }}" }}, LOB: {{ "{{ $labels.lob }}" }},  Service: {{ "{{ $labels.Service }}" }}'

  - name: vifmgr_unable_to_host_moved_lif_final
    interval: 1m
    rules:
      - record: vifmgr_unable_to_host_moved_lif_trigger
        expr: |
          max by (netapp_cluster, node, datacenter, cluster_uuid, vifname, vsrvid, vifip) (
            max_over_time(ems_events{message="vifmgr.unabletohostmovedlif"}[2m])
          )
      - record: vifmgr_unable_to_host_moved_lif_ok_trigger
        expr: |
          max by (netapp_cluster, node, datacenter, cluster_uuid, vifname, vsrvid, vifip) (
            max_over_time(ems_events{message="vifmgr.lifbeinghosted"}[2m])
          )
      - record: vifmgr_unable_to_host_moved_lif_persistent
        expr: |
          (
            vifmgr_unable_to_host_moved_lif_trigger
            or
            vifmgr_unable_to_host_moved_lif_persistent
          )
          unless
          vifmgr_unable_to_host_moved_lif_ok_trigger

  - name: vifmgr_unable_to_host_moved_lif_alerts
    rules:
      - alert: VIFMgrUnableToHostMovedLIFAlert
        expr: vifmgr_unable_to_host_moved_lif_persistent == 1
        for: 2m
        labels:
          severity: critical
          support_group: storage
          team: sci-storage
          component: netapp_network
        annotations:
          summary: '🔴 Unable to host moved LIF {{ "{{ $labels.vifname }}" }}'
          description: |
            'LIF {{ "{{ $labels.vifname }}" }} (on virtual server {{ "{{ $labels.vsrvid }}" }}), IP address {{ "{{ $labels.vifip }}" }}, could not be hosted and is being moved to node {{ "{{ $labels.tonode }}" }}, port {{ "{{ $labels.toport }}" }} (error {{ "{{ $labels.error }}" }}).
            This event will resolve itself when the LIF will be successfully hosted on a node/port.
            Cluster: {{ "{{ $labels.netapp_cluster }}" }}, Node: {{ "{{ $labels.node }}" }} 
            Datacenter: {{ "{{ $labels.datacenter }}" }}, LOB: {{ "{{ $labels.lob }}" }},  Service: {{ "{{ $labels.Service }}" }}'

  - name: vifmgr_port_monitor_final
    interval: 1m
    rules:
      - record: vifmgr_port_monitor_trigger
        expr: |
          max by (netapp_cluster, node, datacenter, cluster_uuid, node_name, port_name) (
            max_over_time(ems_events{message="vifmgr.port.monitor.failed"}[2m])
          )
      - record: vifmgr_port_monitor_ok_trigger
        expr: |
          max by (netapp_cluster, node, datacenter, cluster_uuid, node_name, port_name) (
            max_over_time(ems_events{message="vifmgr.port.monitor.passed"}[2m])
          )
      - record: vifmgr_port_monitor_persistent
        expr: |
          (
            vifmgr_port_monitor_trigger
            or
            vifmgr_port_monitor_persistent
          )
          unless
          vifmgr_port_monitor_ok_trigger

  - name: vifmgr_port_monitor_alerts
    rules:
      - alert: VIFMgrPortMonitorAlert
        expr: vifmgr_port_monitor_persistent == 1
        for: 2m
        labels:
          severity: critical
          support_group: storage
          team: sci-storage
          component: netapp_network
        annotations:
          summary: '🔴 Health check failure on {{ "{{ $labels.port_name }}" }} node {{ "{{ $labels.node_name }}" }}'
          description: |
            'The {{ "{{ $labels.health_check_type }}" }} health check for port {{ "{{ $labels.port_name }}" }} (node {{ "{{ $labels.node_name }}" }}) has failed. The port is operating in a degraded state.
            Check the network cables that are connected to the specified port for any loose connections. Ensure that the physical Ethernet NIC is functioning properly.
            This event will resolve itself when the health check for the port passes.
            Cluster: {{ "{{ $labels.netapp_cluster }}" }}, Node: {{ "{{ $labels.node }}" }} 
            Datacenter: {{ "{{ $labels.datacenter }}" }}, LOB: {{ "{{ $labels.lob }}" }},  Service: {{ "{{ $labels.Service }}" }}'

# This only checks if they are configured - reachability info not available
  - name: ntp_server_final
    interval: 1m
    rules:
      - record: ntp_server_trigger
        expr: |
          count by (netapp_cluster) (ntpserver_labels) < 3
      - record: ntp_server_ok_trigger
        expr: |
          count by (netapp_cluster) (ntpserver_labels) == 3
      - record: ntp_server_persistent
        expr: |
          (
            ntp_server_trigger
            or
            ntp_server_persistent
          )
          unless
          ntp_server_ok_trigger

  - name: ntp_server_alerts
    rules:
      - alert: NTPServerAlert
        expr: ntp_server_persistent == 1
        for: 2m
        labels:
          severity: warning
          support_group: storage
          team: sci-storage
          component: netapp_network
        annotations:
          summary: '🟡 Not enough NTP servers on {{ "{{ $labels.netapp_cluster }}" }}'
          description: |
            'NTP servers are not configured or reachable on {{ "{{ $labels.netapp_cluster }}" }} 
            Please review cluster configuration and ensure connectivity to the servers is ok.
            Cluster: {{ "{{ $labels.netapp_cluster }}" }}, Node: {{ "{{ $labels.node }}" }} 
            Datacenter: {{ "{{ $labels.datacenter }}" }}, LOB: {{ "{{ $labels.lob }}" }},  Service: {{ "{{ $labels.Service }}" }}'

  - name: telnet_enabled_final
    interval: 1m
    rules:
      - record: telnet_disabled_trigger
        expr: |
          max by (netapp_cluster) (
          security_labels{telnet_enabled="false"}) == 1
      - record: telnet_enabled_trigger
        expr: |
          max by (netapp_cluster) (
          security_labels{telnet_enabled="true"}) == 1
      - record: telnet_enabled_persistent
        expr: |
          (
            telnet_enabled_trigger
            or
            telnet_enabled_persistent
          )
          unless
          telnet_disabled_trigger

  - name: telnet_enabled_alerts
    rules:
      - alert: TelnetEnabled
        expr: telnet_enabled_persistent == 1
        for: 2m
        labels:
          severity: critical
          support_group: storage
          team: sci-storage
          component: netapp_network
        annotations:
          summary: '🔴 Telnet is enabled on {{ "{{ $labels.netapp_cluster }}" }}'
          description: |
            'Telnet is enabled on {{ "{{ $labels.netapp_cluster }}" }}. Please disable it immediately!
            Cluster: {{ "{{ $labels.netapp_cluster }}" }}, Node: {{ "{{ $labels.node }}" }} 
            Datacenter: {{ "{{ $labels.datacenter }}" }}, LOB: {{ "{{ $labels.lob }}" }},  Service: {{ "{{ $labels.Service }}" }}'

  - name: lacp_link_inactive_final
    interval: 1m
    rules:
      - record: lacp_link_inactive_trigger
        expr: |
          max by (netapp_cluster, node, datacenter, cluster_uuid, link_aggregate_name, port) (
            max_over_time(ems_events{message="net.ifgrp.lacp.link.inactive"}[2m])
          )
      - record: lacp_link_active_trigger
        expr: |
          max by (netapp_cluster, node, datacenter, cluster_uuid, link_aggregate_name, port) (
            max_over_time(ems_events{message="net.ifgrp.lacp.link.active"}[2m])
          )
      - record: lacp_link_inactive_persistent
        expr: |
          (
            lacp_link_inactive_trigger
            or
            lacp_link_inactive_persistent
          )
          unless
          lacp_link_inactive_trigger

  - name: lacp_link_inactive_alerts
    rules:
      - alert: LACPLinkInactiveAlert
        expr: lacp_link_inactive_persistent == 1
        for: 2m
        labels:
          severity: critical
          support_group: storage
          team: sci-storage
          component: netapp_network
        annotations:
          summary: '🔴 LACP link inactive on {{ "{{ $labels.netapp_cluster }}" }}'
          description: |
            'LACP link inactive on {{ "{{ $labels.netapp_cluster }}" }}, node {{ "{{ $labels.netapp_cluster }}" }},
            ifgrp {{ "{{ $labels.link_aggregate_name }}" }}: port {{ "{{ $labels.port }}" }} is inactive.
            Cluster: {{ "{{ $labels.netapp_cluster }}" }}, Node: {{ "{{ $labels.node }}" }} 
            Datacenter: {{ "{{ $labels.datacenter }}" }}, LOB: {{ "{{ $labels.lob }}" }},  Service: {{ "{{ $labels.Service }}" }}'

  - name: nic_bad_eeprom_detected
    rules:
      - alert: BadEepromDetected
        expr: last_over_time(ems_events{message="netif.badEeprom"}[5m]) == 1
        for: 5m
        labels:
          severity: critical
          support_group: storage
          team: sci-storage
          component: netapp_network
        annotations:
          summary: '🔴 Bad EEPROM detected'
          description: |
            'Bad EEPROM detected on interface {{ "{{ $labels.interface_name }}" }}
            Cluster: {{ "{{ $labels.netapp_cluster }}" }}, Node: {{ "{{ $labels.node }}" }} 
            Datacenter: {{ "{{ $labels.datacenter }}" }}, LOB: {{ "{{ $labels.lob }}" }},  Service: {{ "{{ $labels.Service }}" }}'

  - name: nic_link_errors_detected
    rules:
      - alert: LinkerrorsDetected
        expr: last_over_time(ems_events{message="netif.linkErrors"}[5m]) == 1
        for: 5m
        labels:
          severity: warning
          support_group: storage
          team: sci-storage
          component: netapp_network
        annotations:
          summary: '🟡 Link errors detected'
          description: 
            'Link errors detected on interface {{ "{{ $labels.if_name }}" }} 
            Cluster: {{ "{{ $labels.netapp_cluster }}" }}, Node: {{ "{{ $labels.node }}" }} 
            Datacenter: {{ "{{ $labels.datacenter }}" }}, LOB: {{ "{{ $labels.lob }}" }},  Service: {{ "{{ $labels.Service }}" }}'

  - name: nic_speed_downgraded
    rules:
      - alert: SpeedDowngraded
        expr: last_over_time(ems_events{message="netif.speedDowngraded"}[5m]) == 1
        for: 5m
        labels:
          severity: warning
          support_group: storage
          team: sci-storage
          component: netapp_network
        annotations:
          summary: '🟡 Speed downgraded'
          description: |
            'Speed downgraded on interface {{ "{{ $labels.if_name }}" }}. New speed: {{ "{{ $labels.speed }}" }} 
            Cluster: {{ "{{ $labels.netapp_cluster }}" }}, Node: {{ "{{ $labels.node }}" }} 
            Datacenter: {{ "{{ $labels.datacenter }}" }}, LOB: {{ "{{ $labels.lob }}" }},  Service: {{ "{{ $labels.Service }}" }}'

  - name: duplicate_ip_address
    rules:
      - alert: DuplicateIPAddress
        expr: last_over_time(ems_events{message="netinet.ethr.duplct.ipAdrr"}[5m]) == 1
        for: 5m
        labels:
          severity: critical
          support_group: storage
          team: sci-storage
          component: netapp_network
        annotations:
          summary: '🔴 Duplicate IP address detected'
          description: |
            'Duplicate IP address {{ "{{ $labels.ip_address }}" }} detected with MAC address {{ "{{ $labels.ethernet_address }}" }} 
            Cluster: {{ "{{ $labels.netapp_cluster }}" }}, Node: {{ "{{ $labels.node }}" }} 
            Datacenter: {{ "{{ $labels.datacenter }}" }}, LOB: {{ "{{ $labels.lob }}" }},  Service: {{ "{{ $labels.Service }}" }}'

  - name: lacp_sync_error
    rules:
      - alert: LACPSyncerror
        expr: last_over_time(ems_events{message="pvif.lacp.outofsync"}[5m]) == 1
        for: 5m
        labels:
          severity: warning
          support_group: storage
          team: sci-storage
          component: netapp_network
        annotations:
          summary: '🟡 LACP out of sync'
          description: |
            'LACP out of sync detected on VIF {{ "{{ $labels.vif_name }}" }} and link {{ "{{ $labels.link_name }}" }}
            Cluster: {{ "{{ $labels.netapp_cluster }}" }}, Node: {{ "{{ $labels.node }}" }} 
            Datacenter: {{ "{{ $labels.datacenter }}" }}, LOB: {{ "{{ $labels.lob }}" }},  Service: {{ "{{ $labels.Service }}" }}'

  - name: duplicate_ip_detected
    rules:
      - alert: DuplicateIPDetected
        expr: last_over_time(ems_events{message="tcpip.duplicate.ip"}[5m]) == 1
        for: 5m
        labels:
          severity: critical
          support_group: storage
          team: sci-storage
          component: netapp_network
        annotations:
          summary: '🔴 Duplicate IP address detected'
          description: |
            'Duplicate IP address {{ "{{ $labels.ip_address }}" }} detected with MAC address {{ "{{ $labels.mac_address }}" }}
            Cluster: {{ "{{ $labels.netapp_cluster }}" }}, Node: {{ "{{ $labels.node }}" }} 
            Datacenter: {{ "{{ $labels.datacenter }}" }}, LOB: {{ "{{ $labels.lob }}" }},  Service: {{ "{{ $labels.Service }}" }}'

  - name: vifmgr_startup_fail
    rules:
      - alert: VifmgrStartupFailovererror
        expr: last_over_time(ems_events{message="vifmgr.startup.failover.err"}[5m]) == 1
        for: 5m
        labels:
          severity: warning
          support_group: storage
          team: sci-storage
          component: netapp_network
        annotations:
          summary: '🟡 VIFMgr startup failover error'
          description: |
            'VIFMgr encountered errors during startup
            Cluster: {{ "{{ $labels.netapp_cluster }}" }}, Node: {{ "{{ $labels.node }}" }} 
            Datacenter: {{ "{{ $labels.datacenter }}" }}, LOB: {{ "{{ $labels.lob }}" }},  Service: {{ "{{ $labels.Service }}" }}'

  - name: netif_excessive_link_interrupts
    rules:              
      - alert: netifexcessLinkInterrupts
        expr: last_over_time(ems_events{message="netif.excessLinkInterrupts"}[5m]) == 1
        for: 5m
        labels:
          severity: warning
          support_group: storage
          team: sci-storage
          component: netapp_network
        annotations:
          summary: '🟡 Excessive link interrupts occurred on network interface'
          description: |
            'Excessive link status change interrupts occurred on network interface {{ "{{ $labels.interface_name }}" }} |
            Cluster: {{ "{{ $labels.netapp_cluster }}" }}, Node: {{ "{{ $labels.node }}" }} 
            Datacenter: {{ "{{ $labels.datacenter }}" }}, LOB: {{ "{{ $labels.lob }}" }},  Service: {{ "{{ $labels.Service }}" }}'

  - name: netif_sfp_not_supported
    rules:              
      - alert: NetifSFPNotSupported
        expr: last_over_time(ems_events{message="netif.sfpNotSupported"}[5m]) == 1
        for: 5m
        labels:
          severity: critical
          support_group: storage
          team: sci-storage
          component: netapp_network
        annotations:
          summary: '🔴 SFP or QSFP module is not supported'
          description: |
            'The SFP or QSFP module {{ "{{ $labels.sfp_vendor }}" }} {{ "{{ $labels.sfp_pn }}" }} installed in {{ "{{ $labels.if_name }}" }} is not supported with this network interface
            Cluster: {{ "{{ $labels.netapp_cluster }}" }}, Node: {{ "{{ $labels.node }}" }} 
            Datacenter: {{ "{{ $labels.datacenter }}" }}, LOB: {{ "{{ $labels.lob }}" }},  Service: {{ "{{ $labels.Service }}" }}'

  - name: netif_uncorr_ecc_error
    rules:              
      - alert: UncorEccerror
        expr: last_over_time(ems_events{message="netif.uncorEccError"}[5m]) == 1
        for: 5m
        labels:
          severity: critical
          support_group: storage
          team: sci-storage
          component: netapp_network
        annotations:
          summary: '🔴 Unrecoverable ECC error on network interface'
          description: |
            'Unrecoverable ECC error on network interface {{ "{{ $labels.if_name }}" }}
            Cluster: {{ "{{ $labels.netapp_cluster }}" }}, Node: {{ "{{ $labels.node }}" }} 
            Datacenter: {{ "{{ $labels.datacenter }}" }}, LOB: {{ "{{ $labels.lob }}" }},  Service: {{ "{{ $labels.Service }}" }}'

  - name: vifmgr_clus_link_down
    rules:              
      - alert: vifmgrCluslinkdown
        expr: last_over_time(ems_events{message="vifmgr.clus.linkdown"}[5m]) == 1
        for: 5m
        labels:
          severity: critical
          support_group: storage
          team: sci-storage
          component: netapp_network
        annotations:
          summary: '🔴 Cluster Port Down'
          description: |
            'The cluster port {{ "{{ $labels.port_name }}" }} on node {{ "{{ $labels.node_name }}" }} has gone down unexpectedly
            Cluster: {{ "{{ $labels.netapp_cluster }}" }}, Node: {{ "{{ $labels.node }}" }} 
            Datacenter: {{ "{{ $labels.datacenter }}" }}, LOB: {{ "{{ $labels.lob }}" }},  Service: {{ "{{ $labels.Service }}" }}'

  - name: vifmgr_lifs_cluster_limit
    rules:                          
      - alert: VifmgrlifsClusterlimit
        expr: last_over_time(ems_events{message="vifmgr.lifs.clusterlimit"}[5m]) == 1
        for: 5m
        labels:
          severity: critical
          support_group: storage
          team: sci-storage
          component: netapp_network
        annotations:
          summary: '🔴 Data Lif limit exceeded'
          description: |
            'The total number of data LIFs in this cluster {{ "{{ $labels.number_of_lifs }}" }} exceeds the supported limit of {{ "{{ $labels.lif_limit }}" }}
            Cluster: {{ "{{ $labels.netapp_cluster }}" }}, Node: {{ "{{ $labels.node }}" }} 
            Datacenter: {{ "{{ $labels.datacenter }}" }}, LOB: {{ "{{ $labels.lob }}" }},  Service: {{ "{{ $labels.Service }}" }}'

  - name: vifmgr_port_mtu_mismatch
    rules:                          
      - alert: VifmgrPortMtumismatch
        expr: last_over_time(ems_events{message="vifmgr.port.mtumismatch"}[5m]) == 1
        for: 5m
        labels:
          severity: critical
          support_group: storage
          team: sci-storage
          component: netapp_network
        annotations:
          summary: '🔴 Port MTU mismatch'
          description: |
            'The MTU of port {{ "{{ $labels.port_name }}" }} ({{ "{{ $labels.port_mtu }}" }}) does not match the MTU of broadcast domain {{ "{{ $labels.broadcast_domain }}" }} ({{ "{{ $labels.broadcast_domain_mtu }}" }})
            Cluster: {{ "{{ $labels.netapp_cluster }}" }}, Node: {{ "{{ $labels.node }}" }} 
            Datacenter: {{ "{{ $labels.datacenter }}" }}, LOB: {{ "{{ $labels.lob }}" }},  Service: {{ "{{ $labels.Service }}" }}'

  - name: vifmgr_lif_on_degraded_port
    rules:                          
      - alert: VifmgrPortDeglifHosted
        expr: last_over_time(ems_events{message="vifmgr.portDeg.lifHosted"}[5m]) == 1
        for: 5m
        labels:
          severity: critical
          support_group: storage
          team: sci-storage
          component: netapp_network
        annotations:
          summary: '🔴 LIF hosted on a degraded port'
          description: |
