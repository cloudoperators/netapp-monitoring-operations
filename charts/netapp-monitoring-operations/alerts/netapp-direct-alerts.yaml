{{- if ne (.Values.prometheusRules.ruleGroups.netappDirectAlerts | toString) "false" }}
groups:
  - name: aggregate_relocation_failed
    rules:
      - alert: AggrRelocationFailed
        expr: last_over_time(ems_events{message="arl.netra.ca.check.failed"}[5m]) == 1
        for: 1m
        labels:
          severity: critical
          support_group: {{ dig "support_group" "storage" (.Values.prometheusRules.commonLabels | default dict) }}
          team: {{ dig "team" "sci-storage-ops" (.Values.prometheusRules.commonLabels | default dict) }}
          component: netapp_direct
        annotations:
          summary: '🔴 Relocation of aggregate {{ "{{ $labels.aggregate }}" }} failed'
          description: |
            'Relocation of aggregate {{ "{{ $labels.aggregate }}" }} failed due to {{ "{{ $labels.reason }}" }} preventing object store access on the destination node
            Cluster: {{ "{{ $labels.netapp_cluster }}" }}, Node: {{ "{{ $labels.node }}" }} 
            Datacenter: {{ "{{ $labels.datacenter }}" }}, LOB: {{ "{{ $labels.lob }}" }},  Service: {{ "{{ $labels.Service }}" }}'

  - name: aggregate_giveback_object_store_failed
    rules:
      - alert: AggrGivebackObjStoreFailed
        expr: last_over_time(ems_events{message="gb.netra.ca.check.failed"}[5m]) == 1
        for: 1m
        labels:
          severity: warning
          support_group: {{ dig "support_group" "storage" (.Values.prometheusRules.commonLabels | default dict) }}
          team: {{ dig "team" "sci-storage-ops" (.Values.prometheusRules.commonLabels | default dict) }}
          component: netapp_direct
        annotations:
          summary: '🟡 Giveback of aggregate {{ "{{ $labels.aggregate }}" }} failed'
          description: |
            'Giveback of aggregate {{ "{{ $labels.aggregate }}" }} failed due to {{ "{{ $labels.reason }}" }} preventing object store access on the destination node
            Cluster: {{ "{{ $labels.netapp_cluster }}" }}, Node: {{ "{{ $labels.node }}" }} 
            Datacenter: {{ "{{ $labels.datacenter }}" }}, LOB: {{ "{{ $labels.lob }}" }},  Service: {{ "{{ $labels.Service }}" }}'

  - name: uninitialized_parity_vol
    rules:
      - alert: UninitializedParityVol
        expr: last_over_time(ems_events{message="raid.uninitialized.parity.vol"}[5m]) == 1
        for: 1m
        labels:
          severity: warning
          support_group: {{ dig "support_group" "storage" (.Values.prometheusRules.commonLabels | default dict) }}
          team: {{ dig "team" "sci-storage-ops" (.Values.prometheusRules.commonLabels | default dict) }}
          component: netapp_direct
        annotations:
          summary: '🟡 Raid error uninitialized parity volume'
          description: |
            'WARNING {{ "{{ $labels.vol_type }}" }} {{ "{{ $labels.owner }}" }} {{ "{{ $labels.vol }}" }} was created with no parity; do not fail its data disks!!
            Cluster: {{ "{{ $labels.netapp_cluster }}" }}, Node: {{ "{{ $labels.node }}" }} 
            Datacenter: {{ "{{ $labels.datacenter }}" }}, LOB: {{ "{{ $labels.lob }}" }},  Service: {{ "{{ $labels.Service }}" }}'

  - name: cifs_shadow_copy_fail
    rules:
      - alert: ShadowCopyFail
        expr: last_over_time(ems_events{message="cifs.shadowcopy.failure"}[5m]) == 1
        for: 1m
        labels:
          severity: warning
          support_group: {{ dig "support_group" "storage" (.Values.prometheusRules.commonLabels | default dict) }}
          team: {{ dig "team" "sci-storage-ops" (.Values.prometheusRules.commonLabels | default dict) }}
          component: netapp_direct
        annotations:
          summary: '🟡 CIFS Shadow Copy failed'
          description: |
            'A shadow copy operation has failed: {{ "{{ $labels.errMsg }}" }}. 
            ( Operation : {{ "{{ $labels.operation }}" }} , Share Name : {{ "{{ $labels.shareName }}" }}, Object type is: {{ "{{ $labels.object_type }}" }} with UUID: {{ "{{ $labels.object_uuid }}" }} )
            Cluster: {{ "{{ $labels.netapp_cluster }}" }}, Node: {{ "{{ $labels.node }}" }} 
            Datacenter: {{ "{{ $labels.datacenter }}" }}, LOB: {{ "{{ $labels.lob }}" }},  Service: {{ "{{ $labels.Service }}" }}'

  - name: cifs_many_auths
    rules: 
      - alert: CIFSManyAuths
        expr: last_over_time(ems_events{message="Nblade.cifsManyAuths"}[5m]) == 1
        for: 1m
        labels:
          severity: warning
          support_group: {{ dig "support_group" "storage" (.Values.prometheusRules.commonLabels | default dict) }}
          team: {{ dig "team" "sci-storage-ops" (.Values.prometheusRules.commonLabels | default dict) }}
          component: netapp_direct
        annotations:
          summary: '🟡 CIFS client too many authentication negotiations'
          description: |
            'Many simultaneous new CIFS connections are occurring on Vserver ID {{ "{{ $labels.vsId }}" }} from IP address {{ "{{ $labels.remoteIpAddress }}" }} 
            object type is {{ "{{ $labels.object_type }}" }} with UUID {{ "{{ $labels.object_uuid }}" }}
            Cluster: {{ "{{ $labels.netapp_cluster }}" }}, Node: {{ "{{ $labels.node }}" }} 
            Datacenter: {{ "{{ $labels.datacenter }}" }}, LOB: {{ "{{ $labels.lob }}" }},  Service: {{ "{{ $labels.Service }}" }}'

  - name: cifs_auth_problems
    rules: 
      - alert: CIFSAuthProblems
        expr: last_over_time(ems_events{message="secd.cifsAuth.problem", failureDetail=~".*KRB5KDC_ERR_S_PRINCIPAL_UNKNOWN.*"}[5m]) == 1
        for: 1m
        labels:
          severity: critical
          support_group: {{ dig "support_group" "storage" (.Values.prometheusRules.commonLabels | default dict) }}
          team: {{ dig "team" "sci-storage-ops" (.Values.prometheusRules.commonLabels | default dict) }}
          component: netapp_direct
        annotations:
          summary: '🔴 SVM {{ "{{ $labels.vserverName }}" }} General CIFS authentication problem.'
          description: |
            'SVM {{ "{{ $labels.vserverName }}" }} General CIFS authentication problem: {{ "{{ $labels.failureDetail }}" }}.
            Cluster: {{ "{{ $labels.netapp_cluster }}" }}, Node: {{ "{{ $labels.node }}" }} 
            Datacenter: {{ "{{ $labels.datacenter }}" }}, LOB: {{ "{{ $labels.lob }}" }},  Service: {{ "{{ $labels.Service }}" }}'
  
  - name: dc_out_of_pipes
    rules:
      - alert: DCOutOfPipes
        expr: last_over_time(ems_events{message="secd.dc.out.of.pipe.instances"}[5m]) == 1
        for: 1m
        labels:
          severity: warning
          support_group: {{ dig "support_group" "storage" (.Values.prometheusRules.commonLabels | default dict) }}
          team: {{ dig "team" "sci-storage-ops" (.Values.prometheusRules.commonLabels | default dict) }}
          component: netapp_direct
        annotations:
          summary: '🟡 Domain Controller out of pipe instances'
          description: |
            'MSRPC for Vserver {{ "{{ $labels.vserver }}" }} to {{ "{{ $labels.dc }}" }}:{{ "{{ $labels.pipe }}" }} was retried {{ "{{ $labels.retries }}" }} times (delay: {{ "{{ $labels.delay }}" }} usecs).
            This message occurs when the Windows Domain Controller (DC), while responding to an MSRPC request from Data ONTAP®, returns an error indicating that it ran out of pipe instances in the listening state. This can happen when the requests from Data ONTAP are received by the DC during a timing window when the limited number of listening pipe instance are already allocated to other requests. Such errors received by Data ONTAP might result in longer CIFS/NFS authentication and/or access times, potentially resulting in CIFS/NFS client timeouts.
            Contact Microsoft support.
            Cluster: {{ "{{ $labels.netapp_cluster }}" }}, Node: {{ "{{ $labels.node }}" }} 
            Datacenter: {{ "{{ $labels.datacenter }}" }}, LOB: {{ "{{ $labels.lob }}" }},  Service: {{ "{{ $labels.Service }}" }}'

  - name: netlogon_no_servers
    rules:
      - alert: NetlogonNoServers
        expr: last_over_time(ems_events{message="secd.netlogon.noServers"}[5m]) == 1
        for: 1m
        labels:
          severity: warning
          support_group: {{ dig "support_group" "storage" (.Values.prometheusRules.commonLabels | default dict) }}
          team: {{ dig "team" "sci-storage-ops" (.Values.prometheusRules.commonLabels | default dict) }}
          component: netapp_direct
        annotations:
          summary: '🟡 None of the Netlogon servers are available'
          description: |
            'None of the Netlogon servers configured for Vserver {{ "{{ $labels.vserverName }}" }} are currently accessible via the network.
            Cluster: {{ "{{ $labels.netapp_cluster }}" }}, Node: {{ "{{ $labels.node }}" }} 
            Datacenter: {{ "{{ $labels.datacenter }}" }}, LOB: {{ "{{ $labels.lob }}" }},  Service: {{ "{{ $labels.Service }}" }}'

  - name: secd_memory_exhaustion
    rules:
      - alert: SecdRpcServerRequestDropped
        expr: last_over_time(ems_events{message="secd.rpc.server.request.dropped"}[5m]) == 1
        for: 1m
        labels:
          severity: warning
          support_group: {{ dig "support_group" "storage" (.Values.prometheusRules.commonLabels | default dict) }}
          team: {{ dig "team" "sci-storage-ops" (.Values.prometheusRules.commonLabels | default dict) }}
          component: netapp_direct
        annotations:
          summary: '🟡 RPC dropped due to lack of memory'
          description: |
            'This message occurs when an RPC is dropped by SecD due to memory exhaustion.
            Check whether there is an unexpected increase in the number of authentication requests from CIFS clients. Verify that there are no connectivity issues to the external servers like DNS, LDAP, and DC.
            Cluster: {{ "{{ $labels.netapp_cluster }}" }}, Node: {{ "{{ $labels.node }}" }} 
            Datacenter: {{ "{{ $labels.datacenter }}" }}, LOB: {{ "{{ $labels.lob }}" }},  Service: {{ "{{ $labels.Service }}" }}'


  - name: cluster_port_crc_errors
    rules:
      - alert: ClusterSwitchPortCRCerrors
        expr: last_over_time(ems_events{message="vifmgr.cluscheck.hwerrors"}[5m]) == 1
        for: 1m
        labels:
          severity: critical
          support_group: {{ dig "support_group" "storage" (.Values.prometheusRules.commonLabels | default dict) }}
          team: {{ dig "team" "sci-storage-ops" (.Values.prometheusRules.commonLabels | default dict) }}
          component: netapp_direct
        annotations:
          summary: '🔴 Cluster switch port HW errors'
          description: |
            'Cluster switch port CRC errors on port {{ "{{ $labels.port }}" }}, cluster {{ "{{ $labels.netapp_cluster }}" }}
            Cluster: {{ "{{ $labels.netapp_cluster }}" }}, Node: {{ "{{ $labels.node }}" }} 
            Datacenter: {{ "{{ $labels.datacenter }}" }}, LOB: {{ "{{ $labels.lob }}" }},  Service: {{ "{{ $labels.Service }}" }}'

  - name: cluster_switch_reboot
    rules:
      - alert: ClusterSwitchReboot
        expr: last_over_time(ems_events{message="cluster.switch.reboot"}[5m]) == 1
        for: 1m
        labels:
          severity: critical
          support_group: {{ dig "support_group" "storage" (.Values.prometheusRules.commonLabels | default dict) }}
          team: {{ dig "team" "sci-storage-ops" (.Values.prometheusRules.commonLabels | default dict) }}
          component: netapp_direct
        annotations:
          summary: '🔴 Cluster switch reboot'
          description: |
            'Cluster switch {{ "{{ $labels.switch_name }}" }} reboot
            Cluster: {{ "{{ $labels.netapp_cluster }}" }}, Node: {{ "{{ $labels.node }}" }} 
            Datacenter: {{ "{{ $labels.datacenter }}" }}, LOB: {{ "{{ $labels.lob }}" }},  Service: {{ "{{ $labels.Service }}" }}'

  - name: no_neighbors
    rules:
      - alert: NoNeighbors
        expr: last_over_time(ems_events{message="clus.net.noNeighbors"}[5m]) == 1
        for: 1m
        labels:
          severity: warning
          support_group: {{ dig "support_group" "storage" (.Values.prometheusRules.commonLabels | default dict) }}
          team: {{ dig "team" "sci-storage-ops" (.Values.prometheusRules.commonLabels | default dict) }}
          component: netapp_direct
        annotations:
          summary: '🟡 No neighbors detected'
          description: |
            'No neighbors detected in cluster network 
            Cluster: {{ "{{ $labels.netapp_cluster }}" }}, Node: {{ "{{ $labels.node }}" }} 
            Datacenter: {{ "{{ $labels.datacenter }}" }}, LOB: {{ "{{ $labels.lob }}" }},  Service: {{ "{{ $labels.Service }}" }}'

  - name: rdb_recovery_failed
    rules:
      - alert: RecoveryFailed
        expr: last_over_time(ems_events{message="rdb.recovery.failed"}[5m]) == 1
        for: 1m
        labels:
          severity: critical
          support_group: {{ dig "support_group" "storage" (.Values.prometheusRules.commonLabels | default dict) }}
          team: {{ dig "team" "sci-storage-ops" (.Values.prometheusRules.commonLabels | default dict) }}
          component: netapp_direct
        annotations:
          summary: '🔴 RDB recovery failed'
          description: |
            'RDB recovery failed for unit {{ "{{ $labels.unit }}" }}. error message: {{ "{{ $labels.error_message }}" }}
            Cluster: {{ "{{ $labels.netapp_cluster }}" }}, Node: {{ "{{ $labels.node }}" }} 
            Datacenter: {{ "{{ $labels.datacenter }}" }}, LOB: {{ "{{ $labels.lob }}" }},  Service: {{ "{{ $labels.Service }}" }}'

  - name: rdb_corruption
    rules: 
      - alert: RDBCorruption
        expr: last_over_time(ems_events{message="rdb.corruption.reported"}[5m]) == 1
        for: 1m
        labels:
          severity: critical
          support_group: {{ dig "support_group" "storage" (.Values.prometheusRules.commonLabels | default dict) }}
          team: {{ dig "team" "sci-storage-ops" (.Values.prometheusRules.commonLabels | default dict) }}
          component: netapp_direct
        annotations:
          summary: '🔴 Corruption reported in the local database of Data Replication'
          description: |
            'Corruption reported in the local database of Data Replication Module {{ "{{ $labels.unit }}" }}, error: {{ "{{ $labels.message }}" }}.
            Cluster: {{ "{{" }} $labels.netapp_cluster {{ "}}" }}, Node: {{ "{{" }} $labels.node {{ "}}" }} 
            Datacenter: {{ "{{" }} $labels.datacenter {{ "}}" }}, LOB: {{ "{{ $labels.lob }}" }},  Service: {{ "{{ $labels.Service }}" }}'

  - name: rdb_io_failure
    rules: 
      - alert: RDBIOFailure
        expr: last_over_time(ems_events{message="rdb.env.IOFailure"}[5m]) == 1
        for: 1m
        labels:
          severity: critical
          support_group: {{ dig "support_group" "storage" (.Values.prometheusRules.commonLabels | default dict) }}
          team: {{ dig "team" "sci-storage-ops" (.Values.prometheusRules.commonLabels | default dict) }}
          component: netapp_direct
        annotations:
          summary: '🔴 Error encountered in mroot I/O: {{ "{{ $labels.message }}" }}'
          description: |
           'Error encountered in mroot I/O: {{ "{{ $labels.message }}" }}
           This message occurs when the cluster management Data Replication Module determines that I/O operations on the node's mroot filesystem are failing. This could indicate that the mroot filesystem is full, not mounted, or is encountering other error conditions.
           Contact NetApp technical support for assistance with the mroot verification and recovery procedures.
           Cluster: {{ "{{" }} $labels.netapp_cluster {{ "}}" }}, Node: {{ "{{" }} $labels.node {{ "}}" }}, Datacenter: {{ "{{" }} $labels.datacenter {{ "}}" }}'

  - name: rdb_env_process_duplicate
    rules:  
      - alert: RDBEnvProcessDuplicate
        expr: last_over_time(ems_events{message="rdb.env.processDuplicate"}[5m]) == 1
        for: 1m
        labels:
          severity: critical
          support_group: {{ dig "support_group" "storage" (.Values.prometheusRules.commonLabels | default dict) }}
          team: {{ dig "team" "sci-storage-ops" (.Values.prometheusRules.commonLabels | default dict) }}
          component: netapp_direct
        annotations:
          summary: '🔴 Multiple processes executing, detected by advisory locking violation: {{ "{{ $labels.message }}" }}'
          description: |
           'Multiple processes executing, detected by advisory locking violation: {{ "{{ $labels.message }}" }}
           This message occurs when multiple conflicting instances of the management subsystem processes are executing. The situation was safely detected, but it is necessary to understand why it occurred. Normal system startup and operation should ensure that only one of each process type executes on any node. This can occur when an operator inadvertently runs a second instance by hand under the command shell.
           Verify that all the cluster management processes are running using the diagnostic command 'cluster ring show.' Verify that only one of each is running on the node by using the 'ps' command in the command shell. If this event continues to occur, or if there is any question as to why the extra process was started, then contact NetApp technical support to investigate.
           Cluster: {{ "{{" }} $labels.netapp_cluster {{ "}}" }}, Node: {{ "{{" }} $labels.node {{ "}}" }}, Datacenter: {{ "{{" }} $labels.datacenter {{ "}}" }}'

  - name: rdb_env_replica_corrupt
    rules:  
      - alert: RDBEnvReplicaCorrupt
        expr: last_over_time(ems_events{message="rdb.env.replicaCorrupt"}[5m]) == 1
        for: 1m
        labels:
          severity: critical
          support_group: {{ dig "support_group" "storage" (.Values.prometheusRules.commonLabels | default dict) }}
          team: {{ dig "team" "sci-storage-ops" (.Values.prometheusRules.commonLabels | default dict) }}
          component: netapp_direct
        annotations:
          summary: '🔴 Corruption in the local database of Data Replication Module: {{ "{{ $labels.message }}" }}'
          description: |
           'Corruption in the local database of Data Replication Module: {{ "{{ $labels.message }}" }}
           This message occurs when the cluster management Data Replication Module determines that the node's local replica set is corrupted. If the damage extends beyond the replica set, it might be necessary to recover the mroot filesystem.
           Contact NetApp technical support for assistance with the Data Replication Module and mroot filesystem verification and recovery procedures.
           Cluster: {{ "{{" }} $labels.netapp_cluster {{ "}}" }}, Node: {{ "{{" }} $labels.node {{ "}}" }}, Datacenter: {{ "{{" }} $labels.datacenter {{ "}}" }}'

  - name: rdb_internal_error
    rules:            
      - alert: RDBInternalError
        expr: last_over_time(ems_events{message="rdb.internal.error"}[5m]) == 1
        for: 1m
        labels:
          severity: critical
          support_group: {{ dig "support_group" "storage" (.Values.prometheusRules.commonLabels | default dict) }}
          team: {{ dig "team" "sci-storage-ops" (.Values.prometheusRules.commonLabels | default dict) }}
          component: netapp_direct
        annotations:
          summary: '🔴 Internal program error encountered: {{ "{{ $labels.message }}" }}'
          description: |
           'Internal program error encountered: {{ "{{ $labels.message }}" }}
           This message occurs when the cluster management Data Replication Module encounters an internal error, possibly causing the process to exit. The process should restart automatically, with full service restored.
           Verify that all the cluster management processes are running using the diagnostic command 'cluster ring show.' If not, contact NetApp technical support.
           Cluster: {{ "{{" }} $labels.netapp_cluster {{ "}}" }}, Node: {{ "{{" }} $labels.node {{ "}}" }}, Datacenter: {{ "{{" }} $labels.datacenter {{ "}}" }}'

  - name: ntpd_process_exit
    rules:            
      - alert: NTPDProcessExit
        expr: last_over_time(ems_events{message="spm.ntpd.process.exit"}[5m]) == 1
        for: 1m
        labels:
          severity: critical
          support_group: {{ dig "support_group" "storage" (.Values.prometheusRules.commonLabels | default dict) }}
          team: {{ dig "team" "sci-storage-ops" (.Values.prometheusRules.commonLabels | default dict) }}
          component: netapp_direct
        annotations:
          summary: '🔴 The ntpd process with ID {{ "{{ $labels.id }}" }} exited as a result of {{ "{{ $labels.cause }}" }}. This server will attempt to restart.'
          description: |
           'The ntpd with ID {{ "{{ $labels.id }}" }} exited as a result of {{ "{{ $labels.cause }}" }}. This server will attempt to restart.
           The system attempts to recover by restarting the ntpd process. If the process does not restart within the threshold number of retries, then an AutoSupport message is sent. If your system is not configured to send AutoSupport messages and the issue persists, contact NetApp technical support.
           Cluster: {{ "{{" }} $labels.netapp_cluster {{ "}}" }}, Node: {{ "{{" }} $labels.node {{ "}}" }}, Datacenter: {{ "{{" }} $labels.datacenter {{ "}}" }}'

  - name: vifmgr_process_exit
    rules: 
      - alert: VIFmgrProcessExit
        expr: last_over_time(ems_events{message="spm.vifmgr.process.exit"}[5m]) == 1
        for: 1m
        labels:
          severity: critical
          support_group: {{ dig "support_group" "storage" (.Values.prometheusRules.commonLabels | default dict) }}
          team: {{ dig "team" "sci-storage-ops" (.Values.prometheusRules.commonLabels | default dict) }}
          component: netapp_direct
        annotations:
          summary: '🔴 The vifmgr process with ID {{ "{{ $labels.id }}" }} exited as a result of {{ "{{ $labels.cause }}" }}. This server will attempt to restart.'
          description: |
           'The ntpd with ID {{ "{{ $labels.id }}" }} exited as a result of {{ "{{ $labels.cause }}" }}. This server will attempt to restart.
           Ensure that the LIFs on the current node are hosted on another node in the cluster; if they are not, migrate them to another node. While this problem persists, you should also ensure that the auto-revert and DNS load-balancing features do not migrate the LIFs back to the current node. The system attempts to recover by restarting the subsystem. If the subsystem does not recover within the threshold number of retries, then an AutoSupport message is sent. If your system is not configured to send AutoSupport messages and the issue persists, contact NetApp technical support.
           Cluster: {{ "{{" }} $labels.netapp_cluster {{ "}}" }}, Node: {{ "{{" }} $labels.node {{ "}}" }}, Datacenter: {{ "{{" }} $labels.datacenter {{ "}}" }}'

  - name: disk_medium_errors_alert
    rules:
      - alert: DiskMediumError
        expr: last_over_time(ems_events{message="disk.ioMediumError"}[5m]) == 1
        for: 1m
        labels:
          severity: warning
          support_group: {{ dig "support_group" "storage" (.Values.prometheusRules.commonLabels | default dict) }}
          team: {{ dig "team" "sci-storage-ops" (.Values.prometheusRules.commonLabels | default dict) }}
          component: netapp_direct
        annotations:
          summary: '🟡 Disk I/O medium error'
          description: |
            'Medium Error on disk {{ "{{ $labels.disk_name }}" }}: op {{ "{{ $labels.operation }}" }} sector {{ "{{ $labels.sector }}" }} - sense data {{ "{{ $labels.sense_info }}" }}
            Disk info: {{ "{{ $labels.disk_information }}" }}
            Cluster: {{ "{{ $labels.netapp_cluster }}" }}, Node: {{ "{{ $labels.node }}" }} 
            Datacenter: {{ "{{ $labels.datacenter }}" }}, LOB: {{ "{{ $labels.lob }}" }},  Service: {{ "{{ $labels.Service }}" }}'

  - name: disk_out_of_service_alert
    rules:
      - alert: DiskOutOfService
        expr: last_over_time(ems_events{message="disk.outOfService"}[5m]) == 1
        for: 1m
        labels:
          severity: warning
          support_group: {{ dig "support_group" "storage" (.Values.prometheusRules.commonLabels | default dict) }}
          team: {{ dig "team" "sci-storage-ops" (.Values.prometheusRules.commonLabels | default dict) }}
          component: netapp_direct
        annotations:
          summary: '🟡 Disk out of service'
          description: |
            'Disk out of service  {{ "{{ $labels.disk_name }}" }}: {{ "{{ $labels.reason }}" }}
            POH: {{ "{{ $labels.poh }}" }} - GList {{ "{{ $labels.glist }}" }}
            Cluster: {{ "{{ $labels.netapp_cluster }}" }}, Node: {{ "{{ $labels.node }}" }} 
            Datacenter: {{ "{{ $labels.datacenter }}" }}, LOB: {{ "{{ $labels.lob }}" }},  Service: {{ "{{ $labels.Service }}" }}'

  - name: scsi_cmd_transport_error
    rules:
      - alert: SCSICmdTransportError
        expr: last_over_time(ems_events{message="scsi.cmd.transportError"}[5m]) == 1
        for: 1m
        labels:
          severity: warning
          support_group: {{ dig "support_group" "storage" (.Values.prometheusRules.commonLabels | default dict) }}
          team: {{ dig "team" "sci-storage-ops" (.Values.prometheusRules.commonLabels | default dict) }}
          component: netapp_direct
        annotations:
          summary: '🟡 {{ "{{ $labels.deviceType }}" }} device {{ "{{ $labels.deviceName }}" }}: Transport error'
          description: |
            '{{ "{{ $labels.deviceType }}" }} device {{ "{{ $labels.deviceName }}" }}: Transport error during execution of command: HA status 0x{{ "{{ $labels.ha_status }}" }}: cdb {{ "{{ $labels.cdb }}" }}.
            Disk info: {{ "{{ $labels.disk_information }}" }}
            Cluster: {{ "{{ $labels.netapp_cluster }}" }}, Node: {{ "{{ $labels.node }}" }} 
            Datacenter: {{ "{{ $labels.datacenter }}" }}, LOB: {{ "{{ $labels.lob }}" }},  Service: {{ "{{ $labels.Service }}" }}'

  - name: drive_phy_disabled_error
    rules:
      - alert: DrivePhyDisableerror
        expr: last_over_time(ems_events{message="ds.sas.drivephy.disableErr"}[5m]) == 1
        for: 1m
        labels:
          severity: warning
          support_group: {{ dig "support_group" "storage" (.Values.prometheusRules.commonLabels | default dict) }}
          team: {{ dig "team" "sci-storage-ops" (.Values.prometheusRules.commonLabels | default dict) }}
          component: netapp_direct
        annotations:
          summary: '🟡 SAS drive PHY disable error'
          description: |
            'SAS drive PHY disable error detected. Drive: {{ "{{ $labels.disk_data }}" }}, Reason: {{ "{{ $labels.reason }}" }} 
            Shelf ID: {{ "{{ $labels.shelfID }}" }} Bay: {{ "{{ $labels.bay }}" }} Channels: {{ "{{ $labels.channels }}" }} 
            Element: {{ "{{ $labels.element }}" }} PHY: {{ "{{ $labels.phy }}" }} 
            Cluster: {{ "{{ $labels.netapp_cluster }}" }}, Node: {{ "{{ $labels.node }}" }} 
