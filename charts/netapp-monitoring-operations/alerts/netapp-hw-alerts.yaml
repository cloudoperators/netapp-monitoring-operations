      - record: shelf_temperature_warning_trigger
        expr: |
          max by (netapp_cluster, node, datacenter, cluster_uuid, product_channel, module_type, module_number) (
            max_over_time(ems_events{message="ses.status.ModuleError"}[2m])
          )
      - record: shelf_temperature_ok_trigger
        expr: |
          max by (netapp_cluster, node, datacenter, cluster_uuid, product_channel, module_type, module_number) (
            max_over_time(ems_events{message="ses.status.ModuleInfo"}[2m])
          )
      - record: shelf_temperature_warning_persistent
        expr: |
          (
            shelf_temperature_warning_trigger
            or
            shelf_temperature_warning_persistent
          )
          unless
          shelf_temperature_ok_trigger

  - name: shelf_temperature_warning_alerts
    rules:
      - alert: ShelfTemperatureWarning
        expr: shelf_temperature_warning_persistent == 1
        for: 2m
        labels:
          severity: warning
          support_group: {{ dig "support_group" "storage" (.Values.prometheusRules.commonLabels | default dict) }}
          team: {{ dig "team" "sci-storage" (.Values.prometheusRules.commonLabels | default dict) }}
          component: netapp_hw
        annotations:
          summary: '🟡 {{ "{{ $labels.prodChannel }}" }} temperature warning for {{ "{{ $labels.typeText }}" }} {{ "{{ $labels.thermNumber }}" }}'
          description: |
            'Temperature warning for {{ "{{ $labels.typeText }}" }} {{ "{{ $labels.thermNumber }}" }}: {{ "{{ $labels.errorMsg }}" }} {{ "{{ $labels.errorText }}" }}.
            Current temperature: {{ "{{ $labels.currentCTemp }}" }} C. {{ "{{ $labels.locationText }}" }}.
            Verify that the ambient temperature where the disk shelf is installed is within NetApp equipment specifications by using the "storage shelf show" command, and that airflow clearances are maintained. If this disk shelf also reports fan or fan module errors or warnings, correct those problems now. If the problem persists, and the shelf has multiple temperature sensors of which only one exhibits the problem, replace the module that contains the sensor. If the problem persists, contact NetApp technical support for assistance. The temperature thresholds for each shelf can also be displayed by using the "storage shelf show" command.
            Cluster: {{ "{{ $labels.netapp_cluster }}" }}, Node: {{ "{{ $labels.node }}" }} 
            Datacenter: {{ "{{ $labels.datacenter }}" }}, LOB: {{ "{{ $labels.lob }}" }},  Service: {{ "{{ $labels.Service }}" }}'

  - name: controller_temperature_unreadable
    rules:
      - alert: ControllerTemperatureUnreadable
        expr: last_over_time(ems_events{message="monitor.temp.unreadable"}[5m]) == 1
        for: 5m
        labels:
          severity: critical
          support_group: {{ dig "support_group" "storage" (.Values.prometheusRules.commonLabels | default dict) }}
          team: {{ dig "team" "sci-storage" (.Values.prometheusRules.commonLabels | default dict) }}
          component: netapp_hw
        annotations:
          summary: '🔴 Controller Temperature Unreadable on node {{ "{{ $labels.node }}" }}'
          description: |
            'Controller Temperature Unreadable on node {{ "{{ $labels.node }}" }} cluster {{ "{{ $labels.netapp_cluster }}" }}: {{ "{{ $labels.sensor_name }}" }}
            Cluster: {{ "{{ $labels.netapp_cluster }}" }}, Node: {{ "{{ $labels.node }}" }} 
            Datacenter: {{ "{{ $labels.datacenter }}" }}, LOB: {{ "{{ $labels.lob }}" }},  Service: {{ "{{ $labels.Service }}" }}'

  - name: nand_predict_failure_alert
    rules:
      - alert: NANDPredictFailure
        expr: last_over_time(ems_events{message="nand.predict.fail"}[5m]) == 1
        for: 5m
        labels:
          severity: critical
          support_group: {{ dig "support_group" "storage" (.Values.prometheusRules.commonLabels | default dict) }}
          team: {{ dig "team" "sci-storage" (.Values.prometheusRules.commonLabels | default dict) }}
          component: netapp_hw
        annotations:
          summary: '🔴 NVRAM NAND predict failure on node {{ "{{ $labels.node }}" }}'
          description: |
            'NVRAM NAND predict failure on node {{ "{{ $labels.node }}" }} cluster {{ "{{ $labels.netapp_cluster }}" }}: {{ "{{ $labels.device }}" }}
            Cluster: {{ "{{ $labels.netapp_cluster }}" }}, Node: {{ "{{ $labels.node }}" }} 
            Datacenter: {{ "{{ $labels.datacenter }}" }}, LOB: {{ "{{ $labels.lob }}" }},  Service: {{ "{{ $labels.Service }}" }}'

  - name: node_watchdog
    rules:
      - alert: NodeWatchdog
        expr: last_over_time(ems_events{message="nodewatchdog.node.failure"}[5m]) == 1
        for: 5m
        labels:
          severity: critical
          support_group: {{ dig "support_group" "storage" (.Values.prometheusRules.commonLabels | default dict) }}
          team: {{ dig "team" "sci-storage" (.Values.prometheusRules.commonLabels | default dict) }}
          component: netapp_hw
        annotations:
          summary: '🔴 Data ONTAP has experienced a serious internal error: {{ "{{ $labels.condition }}" }}'
          description: |
            'Data ONTAP has experienced a serious internal error: {{ "{{ $labels.condition }}" }}. This might cause the node experiencing the problem to become unresponsive to data access.
            The affected process may produce a core file which can be analyzed. Contact NetApp technical support if the condition persists and possible analysis of the core file.
            {{ "{{ $labels.diagnosis }}" }}.
            Cluster: {{ "{{ $labels.netapp_cluster }}" }}, Node: {{ "{{ $labels.node }}" }} 
            Datacenter: {{ "{{ $labels.datacenter }}" }}, LOB: {{ "{{ $labels.lob }}" }},  Service: {{ "{{ $labels.Service }}" }}'

  - name: fcp_sfp_invalid
    rules:
      - alert: FCPSFPInvalid
        expr: last_over_time(ems_events{message="scsitarget.fcp.sfp.invalid"}[5m]) == 1
        for: 5m
        labels:
          severity: warning
          support_group: {{ dig "support_group" "storage" (.Values.prometheusRules.commonLabels | default dict) }}
          team: {{ dig "team" "sci-storage" (.Values.prometheusRules.commonLabels | default dict) }}
          component: netapp_hw
        annotations:
          summary: '🟡 The SFP in FC adapter {{ "{{ $labels.adapter }}" }} is not valid.'
          description: |
            'The SFP in FC adapter {{ "{{ $labels.adapter }}" }} is not valid. ({{ "{{ $labels.reason }}" }})
            Cluster: {{ "{{ $labels.netapp_cluster }}" }}, Node: {{ "{{ $labels.node }}" }} 
            Datacenter: {{ "{{ $labels.datacenter }}" }}, LOB: {{ "{{ $labels.lob }}" }},  Service: {{ "{{ $labels.Service }}" }}'

  - name: nvram_excessive_cecc_errors
    rules:
      - alert: ExcessiveCECerrors
        expr: last_over_time(ems_events{message="nvram.excessive.cecc.errs"}[5m]) == 1
        for: 5m
        labels:
          severity: warning
          support_group: {{ dig "support_group" "storage" (.Values.prometheusRules.commonLabels | default dict) }}
          team: {{ dig "team" "sci-storage" (.Values.prometheusRules.commonLabels | default dict) }}
          component: netapp_hw
        annotations:
          summary: '🟡 NVRAM Excessive CECC errors'
          description: |
            'NVRAM Excessive CECC errors detected 
            Cluster: {{ "{{ $labels.netapp_cluster }}" }}, Node: {{ "{{ $labels.node }}" }} 
            Datacenter: {{ "{{ $labels.datacenter }}" }}, LOB: {{ "{{ $labels.lob }}" }},  Service: {{ "{{ $labels.Service }}" }}'

  - name: fcp_adapter_failed
    rules:
      - alert: FcpAdapterFailed
        expr: last_over_time(ems_events{message="callhome.fcp.adapter.failed"}[5m]) == 1
        for: 5m
        labels:
          severity: critical
          support_group: {{ dig "support_group" "storage" (.Values.prometheusRules.commonLabels | default dict) }}
          team: {{ dig "team" "sci-storage" (.Values.prometheusRules.commonLabels | default dict) }}
          component: netapp_hw
        annotations:
          summary: '🔴 FCP Adapter Failed'
          description: |
            'Call home for {{ "{{ $labels.subject }}" }} 
            Cluster: {{ "{{ $labels.netapp_cluster }}" }}, Node: {{ "{{ $labels.node }}" }} 
            Datacenter: {{ "{{ $labels.datacenter }}" }}, LOB: {{ "{{ $labels.lob }}" }},  Service: {{ "{{ $labels.Service }}" }}'
