            This can impact data availability. The alert resolves when the aggregate is back online ("raid.vol.state.online").
            Cluster: {{ "{{ $labels.netapp_cluster }}" }}, Node: {{ "{{ $labels.node }}" }} 
            Datacenter: {{ "{{ $labels.datacenter }}" }}, LOB: {{ "{{ $labels.lob }}" }},  Service: {{ "{{ $labels.Service }}" }}'

  - name: aggregate_restricted
    interval: 1m
    rules:
      - record: aggregate_restricted_trigger
        expr: |
          max by (netapp_cluster, node, datacenter, cluster_uuid, aggregate) (
            max_over_time(ems_events{message="callhome.aggr.restricted"}[2m])
          )
      - record: raid_vol_state_online_trigger
        expr: |
          max by (netapp_cluster, node, datacenter, cluster_uuid, aggregate) (
            max_over_time(ems_events{message="raid.vol.state.online"}[2m])
          )
      - record: aggregate_restricted_persistent
        expr: |
          (
            aggregate_restricted_trigger
            or
            aggregate_restricted_persistent
          )
          unless
          raid_vol_state_online_trigger

  - name: aggregate_restricted_alerts
    rules:
      - alert: AggrRestricted
        expr: aggregate_restricted_persistent == 1
        for: 2m
        labels:
          severity: critical
          support_group: {{ dig "support_group" "storage" (.Values.prometheusRules.commonLabels | default dict) }}
          team: {{ dig "team" "sci-storage" (.Values.prometheusRules.commonLabels | default dict) }}
          component: netapp_aggr
        annotations:
          summary: '🔴 Aggregate {{ "{{ $labels.aggregate }}" }} on {{ "{{ $labels.node }}" }} is restricted'
          description: |
            'The state of aggregate {{ "{{ $labels.aggregate }}" }} on node {{ "{{ $labels.node }}" }} has changed to a non-optimal state.
            This can impact data availability. The alert resolves when the aggregate is back online ("raid.vol.state.online").
            Cluster: {{ "{{ $labels.netapp_cluster }}" }}, Node: {{ "{{ $labels.node }}" }} 
            Datacenter: {{ "{{ $labels.datacenter }}" }}, LOB: {{ "{{ $labels.lob }}" }},  Service: {{ "{{ $labels.Service }}" }}'

  - name: aggregate_relocation_failed
    rules:
      - alert: AggrRelocationFailed
        expr: last_over_time(ems_events{message="arl.netra.ca.check.failed"}[1m]) == 1
        for: 5m
        labels:
          severity: critical
          support_group: {{ dig "support_group" "storage" (.Values.prometheusRules.commonLabels | default dict) }}
          team: {{ dig "team" "sci-storage" (.Values.prometheusRules.commonLabels | default dict) }}
          component: netapp_aggr
        annotations:
          summary: '🔴 Relocation of aggregate {{ "{{ $labels.aggregate }}" }} failed'
          description: |
            'Relocation of aggregate {{ "{{ $labels.aggregate }}" }} failed due to {{ "{{ $labels.reason }}" }} preventing object store access on the destination node
            Cluster: {{ "{{ $labels.netapp_cluster }}" }}, Node: {{ "{{ $labels.node }}" }} 
            Datacenter: {{ "{{ $labels.datacenter }}" }}, LOB: {{ "{{ $labels.lob }}" }},  Service: {{ "{{ $labels.Service }}" }}'

  - name: aggregate_giveback_object_store_failed
    rules:
      - alert: AggrGivebackObjStoreFailed
        expr: last_over_time(ems_events{message="gb.netra.ca.check.failed"}[1m]) == 1
        for: 5m
        labels:
          severity: critical
          support_group: {{ dig "support_group" "storage" (.Values.prometheusRules.commonLabels | default dict) }}
          team: {{ dig "team" "sci-storage" (.Values.prometheusRules.commonLabels | default dict) }}
          component: netapp_aggr
        annotations:
          summary: '🔴 Giveback of aggregate {{ "{{ $labels.aggregate }}" }} failed'
          description: |
            'Giveback of aggregate {{ "{{ $labels.aggregate }}" }} failed due to {{ "{{ $labels.reason }}" }} preventing object store access on the destination node
            Cluster: {{ "{{ $labels.netapp_cluster }}" }}, Node: {{ "{{ $labels.node }}" }} 
            Datacenter: {{ "{{ $labels.datacenter }}" }}, LOB: {{ "{{ $labels.lob }}" }},  Service: {{ "{{ $labels.Service }}" }}'

  - name: uninitialized_parity_vol
    rules:
      - alert: UninitializedParityVol
        expr: last_over_time(ems_events{message="raid.uninitialized.parity.vol"}[5m]) == 1
        for: 5m
        labels:
          severity: warning
          support_group: {{ dig "support_group" "storage" (.Values.prometheusRules.commonLabels | default dict) }}
          team: {{ dig "team" "sci-storage" (.Values.prometheusRules.commonLabels | default dict) }}
          component: netapp_aggr
        annotations:
          summary: '🟡 Raid error uninitialized parity volume'
          description: |
            'WARNING {{ "{{ $labels.vol_type }}" }} {{ "{{ $labels.owner }}" }} {{ "{{ $labels.vol }}" }} was created with no parity; do not fail its data disks!!
            Cluster: {{ "{{ $labels.netapp_cluster }}" }}, Node: {{ "{{ $labels.node }}" }} 
            Datacenter: {{ "{{ $labels.datacenter }}" }}, LOB: {{ "{{ $labels.lob }}" }},  Service: {{ "{{ $labels.Service }}" }}'
