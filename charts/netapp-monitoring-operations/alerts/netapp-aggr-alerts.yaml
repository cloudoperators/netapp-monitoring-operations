{{- if ne (.Values.prometheusRules.ruleGroups.netappAggrAlerts | toString) "false" }}
groups:
  - name: aggr_offline_final
    interval: 1m
    rules:
      - record: aggr_offline_trigger
        expr: |
          max by (netapp_cluster, node, aggr) (aggr_labels{state!="online"}) == 1
      - record: aggr_online_trigger
        expr: |
          max by (netapp_cluster, node, aggr) (aggr_labels{state="online"}) == 1
      - record: aggr_offline_persistent
        expr: |
          (
            aggr_offline_trigger
            or
            aggr_offline_persistent
          )
          unless
          aggr_online_trigger

  - name: aggr_offline_alerts
    rules:
      - alert: AggrOfflineAlert
        expr: aggr_offline_persistent == 1
        for: 2m
        labels:
          severity: critical
          support_group: {{ dig "support_group" "storage" (.Values.prometheusRules.commonLabels | default dict) }}
          team: {{ dig "team" "sci-storage" (.Values.prometheusRules.commonLabels | default dict) }}
          component: netapp_aggr
        annotations:
          summary: '🔴 Aggregate {{ "{{ $labels.aggr }}" }} is offline'
          description: |
            'Aggregate {{ "{{ $labels.aggr }}" }} on node {{ "{{ $labels.node }}" }}, cluster {{ "{{ $labels.netapp_cluster }}" }} is offline.
            Cluster: {{ "{{ $labels.netapp_cluster }}" }}, Node: {{ "{{ $labels.node }}" }} 
            Datacenter: {{ "{{ $labels.datacenter }}" }}, LOB: {{ "{{ $labels.lob }}" }},  Service: {{ "{{ $labels.Service }}" }}'

  - name: sci_aggr_nearly_full_final
    interval: 1m
    rules:
      - record: sci_aggr_nearly_full_trigger
        expr: |
          (avg_over_time(aggr_space_physical_used_percent{netapp_cluster=~"stnpca.*"}[2h])) > 70
      - record: sci_aggr_nearly_full_ok_trigger
        expr: |
          (avg_over_time(aggr_space_physical_used_percent{netapp_cluster=~"stnpca.*"}[2h])) < 70
      - record: sci_aggr_nearly_full_persistent
        expr: |
          (
            sci_aggr_nearly_full_trigger
            or
            sci_aggr_nearly_full_persistent
          )
          unless
          sci_aggr_nearly_full_ok_trigger

  - name: sci_aggr_nearly_full_alerts
