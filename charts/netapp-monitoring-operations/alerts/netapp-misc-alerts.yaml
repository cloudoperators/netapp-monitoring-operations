{{- if ne (.Values.prometheusRules.ruleGroups.netappMiscAlerts | toString) "false" }}
groups:
  - name: km_run_external_setup_final
    interval: 1m
    rules:
      - record: km_run_external_setup_trigger
        expr: |
          max by (netapp_cluster, node, datacenter, cluster_uuid, name) (
            max_over_time(ems_events{message="km.run.external.setup"}[2m])
          )
      - record: km_keyserver_available_trigger
        expr: |
          max by (netapp_cluster, node, datacenter, cluster_uuid, name) (
            max_over_time(ems_events{message="km.keyserver.available"}[2m])
          )
      - record: km_run_external_setup_persistent
        expr: |
          (
            km_run_external_setup_trigger
            or
            km_run_external_setup_persistent
          )
          unless
          km_keyserver_available_trigger

  - name: km_run_external_setup_alerts
    rules:
      - alert: KmRunExternalSetup
        expr: km_run_external_setup_persistent == 1
        for: 2m
        labels:
          severity: warning
          support_group: {{ dig "support_group" "storage" (.Values.prometheusRules.commonLabels | default dict) }}
          team: {{ dig "team" "sci-storage-ops" (.Values.prometheusRules.commonLabels | default dict) }}
          component: netapp_misc
        annotations:
          summary: '🟡 External Key Manager setup required on {{ "{{ $labels.node }}" }}'
          description: |
            'External Key Manager (KMIP) setup is required on node {{ "{{ $labels.node }}" }}. 
            The alert resolves when the event "km.keyserver.available" is detected.
            Cluster: {{ "{{ $labels.netapp_cluster }}" }}, Node: {{ "{{ $labels.node }}" }} 
            Datacenter: {{ "{{ $labels.datacenter }}" }}, LOB: {{ "{{ $labels.lob }}" }},  Service: {{ "{{ $labels.Service }}" }}'

  - name: km_keyserver_notavailable_final
    interval: 1m
    rules:
      - record: km_keyserver_notavailable_trigger
        expr: |
          max by (netapp_cluster, node, datacenter, cluster_uuid, vserver, address) (
            max_over_time(ems_events{message="km.keyserver.notavailable"}[2m])
          )
      - record: km_keyserver_available_trigger
        expr: |
          max by (netapp_cluster, node, datacenter, cluster_uuid, vserver, address) (
            max_over_time(ems_events{message="km.keyserver.available"}[2m])
          )
      - record: km_keyserver_notavailable_persistent
        expr: |
          (
            km_keyserver_notavailable_trigger
            or
            km_keyserver_notavailable_persistent
          )
          unless
          km_keyserver_available_trigger

  - name: km_keyserver_notavailable_alerts
    rules:
      - alert: KmKeyserverNotavailable
        expr: km_keyserver_notavailable_persistent == 1
        for: 2m
        labels:
          severity: critical
          support_group: {{ dig "support_group" "storage" (.Values.prometheusRules.commonLabels | default dict) }}
          team: {{ dig "team" "sci-storage-ops" (.Values.prometheusRules.commonLabels | default dict) }}
          component: netapp_misc
        annotations:
          summary: '🔴 Key server not available on {{ "{{ $labels.node }}" }}'
          description: |
            'The external key server (KMIP) with address {{ "{{ $labels.address }}" }} is not available to node {{ "{{ $labels.node }}" }}. 
            This can impact access to encrypted data. The alert resolves when the event "km.keyserver.available" is detected.
            Cluster: {{ "{{ $labels.netapp_cluster }}" }}, Node: {{ "{{ $labels.node }}" }} 
            Datacenter: {{ "{{ $labels.datacenter }}" }}, LOB: {{ "{{ $labels.lob }}" }},  Service: {{ "{{ $labels.Service }}" }}'

  - name: km_keyretrieve_failed_final
    interval: 1m
    rules:
      - record: km_keyretrieve_failed_trigger
        expr: |
          max by (netapp_cluster, node, datacenter, cluster_uuid, name) (
            max_over_time(ems_events{message="km.keyretrieve.failed"}[2m])
          )
      - record: km_keyserver_available_trigger
        expr: |
          max by (netapp_cluster, node, datacenter, cluster_uuid, name) (
            max_over_time(ems_events{message="km.keyserver.available"}[2m])
          )
      - record: km_keyretrieve_failed_persistent
        expr: |
          (
            km_keyretrieve_failed_trigger
            or
            km_keyretrieve_failed_persistent
          )
          unless
          km_keyserver_available_trigger

  - name: km_keyretrieve_failed_alerts
    rules:
      - alert: KmKeyretrieveFailed
        expr: km_keyretrieve_failed_persistent == 1
        for: 2m
        labels:
          severity: critical
          support_group: {{ dig "support_group" "storage" (.Values.prometheusRules.commonLabels | default dict) }}
          team: {{ dig "team" "sci-storage-ops" (.Values.prometheusRules.commonLabels | default dict) }}
          component: netapp_misc
        annotations:
          summary: '🔴 Key retrieval failed on {{ "{{ $labels.node }}" }}'
          description: |
            'Failed to retrieve encryption keys from the external key server on node {{ "{{ $labels.node }}" }}. 
            The alert resolves when the event "km.keyserver.available" is detected.
            Cluster: {{ "{{ $labels.netapp_cluster }}" }}, Node: {{ "{{ $labels.node }}" }} 
            Datacenter: {{ "{{ $labels.datacenter }}" }}, LOB: {{ "{{ $labels.lob }}" }},  Service: {{ "{{ $labels.Service }}" }}'

  - name: vserver_stop_failed_final
    interval: 1m
    rules:
      - record: vserver_stop_failed_trigger
        expr: |
          max by (netapp_cluster, node, datacenter, cluster_uuid, svm, svm_uuid) (
            max_over_time(ems_events{message="vserver.stop.failed"}[2m])
          )
      - record: vserver_stop_succeeded_trigger
        expr: |
          max by (netapp_cluster, node, datacenter, cluster_uuid, svm, svm_uuid) (
            max_over_time(ems_events{message="vserver.stop.succeeded"}[2m])
          )
      - record: vserver_stop_failed_persistent
        expr: |
          (
            vserver_stop_failed_trigger
            or
            vserver_stop_failed_persistent
          )
          unless
          vserver_stop_succeeded_trigger

  - name: vserver_stop_failed_alerts
    rules:
      - alert: VServerStopFailed
        expr: vserver_stop_failed_persistent == 1
        for: 2m
        labels:
          severity: warning
          support_group: {{ dig "support_group" "storage" (.Values.prometheusRules.commonLabels | default dict) }}
          team: {{ dig "team" "sci-storage-ops" (.Values.prometheusRules.commonLabels | default dict) }}
          component: netapp_misc
        annotations:
          summary: '🟡 Failed to stop SVM {{ "{{ $labels.svm }}" }}'
          description: |
            'An attempt to stop SVM {{ "{{ $labels.svm }}" }} (UUID: {{ "{{ $labels.svm_uuid }}" }}) on Cluster {{ "{{ $labels.netapp_cluster }}" }} has failed. 
            The alert resolves when the stop operation eventually succeeds ("vserver.stop.succeeded").
            Cluster: {{ "{{ $labels.netapp_cluster }}" }}, Node: {{ "{{ $labels.node }}" }} 
            Datacenter: {{ "{{ $labels.datacenter }}" }}, LOB: {{ "{{ $labels.lob }}" }},  Service: {{ "{{ $labels.Service }}" }}'

  - name: varfs_backup_failed_final
    interval: 1m
    rules:
      - record: varfs_backup_failed_trigger
        expr: |
          max by (netapp_cluster, node, datacenter, cluster_uuid) (
            max_over_time(ems_events{message="boot.varfs.backup.issue"}[2m])
          )
      - record: varfs_backup_succeeded_trigger
        expr: |
          max by (netapp_cluster, node, datacenter, cluster_uuid) (
            max_over_time(ems_events{message="boot.varfs.backup.success"}[2m])
          )
      - record: varfs_backup_failed_persistent
        expr: |
          (
            varfs_backup_failed_trigger
            or
            varfs_backup_failed_persistent
          )
          unless
          varfs_backup_succeeded_trigger

  - name: varfs_backup_failed_alerts
    rules:
      - alert: VarfsBackupFailed
        expr: varfs_backup_failed_persistent == 1
        for: 2m
        labels:
          severity: warning
          support_group: {{ dig "support_group" "storage" (.Values.prometheusRules.commonLabels | default dict) }}
          team: {{ dig "team" "sci-storage-ops" (.Values.prometheusRules.commonLabels | default dict) }}
          component: netapp_misc
        annotations:
          summary: '🟡 Failed to back up varfs'
          description: |
            'Failed to backup varfs to boot device on cluster {{ "{{ $labels.netapp_cluster }}" }} node {{ "{{ $labels.node }}" }}: {{ "{{ $labels.error }}" }}.
            Contact NetApp Technical support for assistance.
            Cluster: {{ "{{ $labels.netapp_cluster }}" }}, Node: {{ "{{ $labels.node }}" }} 
            Datacenter: {{ "{{ $labels.datacenter }}" }}, LOB: {{ "{{ $labels.lob }}" }},  Service: {{ "{{ $labels.Service }}" }}'

  - name: health_monitor_alert_final
    interval: 1m
    rules:
      - record: health_monitor_alert_failed_trigger
        expr: |
          max by (netapp_cluster, node, datacenter, cluster_uuid, monitor, alert_id) (
            max_over_time(ems_events{message="hm.alert.raised"}[2m])
          )
      - record: health_monitor_alert_ok_trigger
        expr: |
          max by (netapp_cluster, node, datacenter, cluster_uuid, monitor, alert_id) (
            max_over_time(ems_events{message="hm.alert.cleared"}[2m])
          )
      - record: health_monitor_alert_failed_persistent
        expr: |
          (
            health_monitor_alert_failed_trigger
            or
            health_monitor_alert_failed_persistent
          )
          unless
          health_monitor_alert_ok_trigger

  - name: health_monitor_alert_failed_alerts
    rules:
      - alert: HealthMonitorAlert
        expr: health_monitor_alert_failed_persistent == 1
        for: 2m
        labels:
          severity: warning
          support_group: {{ dig "support_group" "storage" (.Values.prometheusRules.commonLabels | default dict) }}
          team: {{ dig "team" "sci-storage-ops" (.Values.prometheusRules.commonLabels | default dict) }}
          component: netapp_misc
        annotations:
          summary: '🟡 Health Alert on cluster {{ "{{ $labels.netapp_cluster }}" }}'
          description: |
            'Health Alert raised on cluster {{ "{{ $labels.netapp_cluster }}" }} node {{ "{{ $labels.node }}" }}: {{ "{{ $labels.detailed_info }}" }}.
            Cluster: {{ "{{ $labels.netapp_cluster }}" }}, Node: {{ "{{ $labels.node }}" }} 
            Datacenter: {{ "{{ $labels.datacenter }}" }}, LOB: {{ "{{ $labels.lob }}" }},  Service: {{ "{{ $labels.Service }}" }}'

  - name: qos_monitor_memory_alert_final
    interval: 1m
    rules:
      - record: qos_monitor_memory_low_trigger
        expr: |
          max by (netapp_cluster, node, datacenter, cluster_uuid) (
            max_over_time(ems_events{message="qos.monitor.memory.maxed"}[2m])
          )
      - record: qos_monitor_memory_ok_trigger
        expr: |
          max by (netapp_cluster, node, datacenter, cluster_uuid) (
            max_over_time(ems_events{message="qos.monitor.memory.abated"}[2m])
          )
      - record: qos_monitor_memory_low_persistent
        expr: |
          (
            qos_monitor_memory_low_trigger
            or
            qos_monitor_memory_low_persistent
          )
          unless
          qos_monitor_memory_ok_trigger

  - name: qos_monitor_memory_alerts
    rules:
      - alert: QOSMonitorMemoryLow
        expr: qos_monitor_memory_low_persistent == 1
        for: 2m
        labels:
          severity: warning
          support_group: {{ dig "support_group" "storage" (.Values.prometheusRules.commonLabels | default dict) }}
          team: {{ dig "team" "sci-storage-ops" (.Values.prometheusRules.commonLabels | default dict) }}
          component: netapp_misc
        annotations:
          summary: '🟡 QoS dynamic memory has reached its limit. Some QoS features might operate in a limited capacity.'
          description: |
            'QoS dynamic memory has reached its limit. Some QoS features might operate in a limited capacity.
            Some active workloads or streams should be deleted to free up memory. Use the 'statistics show -object workload -counter ops' command to determine which workloads are active. Active workloads will show non-zero ops. Then use the 'workload delete [workload name]' command multiple times to remove particular workloads. Alternatively, use the 'stream delete -workload [workload name] *' command to delete the associated streams from the active workload.
            Cluster: {{ "{{ $labels.netapp_cluster }}" }}, Node: {{ "{{ $labels.node }}" }} 
            Datacenter: {{ "{{ $labels.datacenter }}" }}, LOB: {{ "{{ $labels.lob }}" }},  Service: {{ "{{ $labels.Service }}" }}'

  - name: upgrademgr_update_pausedErr_final
    interval: 1m
    rules:
      - record: upgrademgr_update_pausedErr_trigger
        expr: |
          max by (netapp_cluster, node, datacenter, cluster_uuid, name) (
            max_over_time(ems_events{message="upgrademgr.update.pausedErr"}[2m])
          )
      - record: upgrademgr_update_resumed_trigger
        expr: |
          max by (netapp_cluster, node, datacenter, cluster_uuid, name) (
            max_over_time(ems_events{message="upgrademgr.update.resumed"}[2m])
          )
      - record: upgrademgr_update_pausedErr_persistent
        expr: |
          (
            upgrademgr_update_pausedErr_trigger
            or
            upgrademgr_update_pausedErr_persistent
          )
          unless
          upgrademgr_update_resumed_trigger

  - name: upgrademgr_update_pausedErr_alerts
    rules:
      - alert: UpgrademgrUpdatePausedErr
        expr: upgrademgr_update_pausedErr_persistent == 1
        for: 2m
        labels:
          severity: info
          support_group: {{ dig "support_group" "storage" (.Values.prometheusRules.commonLabels | default dict) }}
          team: {{ dig "team" "sci-storage-ops" (.Values.prometheusRules.commonLabels | default dict) }}
          component: netapp_misc
        annotations:
          summary: '🟡 Upgrade paused due to error on {{ "{{ $labels.node }}" }}'
          description: |
            'The automated upgrade on node {{ "{{ $labels.node }}" }} (Cluster: {{ "{{ $labels.netapp_cluster }}" }}) has been paused due to an error. 
            The alert resolves when the event "upgrademgr.update.resumed" is detected.
            Cluster: {{ "{{ $labels.netapp_cluster }}" }}, Node: {{ "{{ $labels.node }}" }} 
            Datacenter: {{ "{{ $labels.datacenter }}" }}, LOB: {{ "{{ $labels.lob }}" }},  Service: {{ "{{ $labels.Service }}" }}'
 {{- else }}
 groups: []
 {{- end }}
 