prometheusRules:
  create: true
  # Labels applied to every PrometheusRule's metadata. These must match your
  # Prometheus ruleSelector so the rules are picked up; set whatever key/value the
  # selector expects (here `prometheus: storage`) and add any extra labels below.
  labels:
    prometheus: storage-metrics-product
  # Enable or disable an entire alert file. One toggle per file; the key is the
  # camelCase form of the file name. Set a key to false to drop that file's rules.
  ruleGroups:
    brocadeErrorAlerts: false      # brocade-error-alerts.yaml (forge, not in sci scope)
    harvestPollerAlerts: true      # harvest-poller-alerts.yaml
    netappAggrAlerts: true         # netapp-aggr-alerts.yaml
    netappCifsAlerts: true         # netapp-cifs-alerts.yaml
    netappClusterAlerts: true      # netapp-cluster-alerts.yaml
    netappDiskAlerts: true         # netapp-disk-alerts.yaml
    netappHaAlerts: true           # netapp-ha-alerts.yaml
    netappHwAlerts: true           # netapp-hw-alerts.yaml
    netappLunAlerts: true          # netapp-lun-alerts.yaml
    netappMediatorAlerts: true     # netapp-mediator-alerts.yaml
    netappMiscAlerts: true         # netapp-misc-alerts.yaml
    netappNetworkAlerts: true      # netapp-network-alerts.yaml
    netappNfsAlerts: true          # netapp-nfs-alerts.yaml
    netappNvdimmAlerts: true       # netapp-nvdimm-alerts.yaml
    netappVolumeAlerts: true       # netapp-volume-alerts.yaml
    powerscaleErrorAlerts: false   # powerscale-error-alerts.yaml (forge, not in sci scope)
    purestorageErrorAlerts: false  # purestorage-error-alerts.yaml (forge, not in sci scope)
    pvcUsageAlerts: false          # pvc-usage-alerts.yaml (forge, not in sci scope)
  commonLabels:
    team: sci-storage
    support_group: storage

podMonitor:
  scrapeInterval: 15s
  # Labels applied to the PodMonitor metadata. These must match your Prometheus
  # podMonitorSelector so the resource is picked up; set whatever key/value the
  # selector expects (here `prometheus: storage`) and add any extra labels below.
  labels:
    prometheus: storage-metrics-product
  # Namespace(s) where your target deployment pods run.
  targetNamespaces:
    - storage-product
  # Pod labels that uniquely select your deployment pods (and exclude netapp-harvest).
  selectorMatchLabels:
    ccloud/service: netapp-monitoring
  # Name of the container port exposed by your pod. The poller container exposes
  # port 13000 named "metrics"; the worker container's port is named "liveness",
  # so selecting "metrics" scrapes ONLY the poller container.
  port: metrics
  path: /metrics
  scheme: http
  # Optional: pod label key whose value becomes the Prometheus job label.
  # ccloud/service has the value "netapp-monitoring", so job=netapp-monitoring.
  jobLabel: ccloud/service
  # Optional relabelings applied at target relabel phase.
  relabelings: []
  # Optional additional metric relabelings appended after netapp_cluster mapping.
  additionalMetricRelabelings: []

# Extra raw manifests rendered verbatim. Provide complete Kubernetes objects as a
# list; each entry is emitted as-is. Helm template expressions inside the manifest
# are evaluated (via tpl), so you can reference values like `{{ .Release.Namespace }}`.
# Example: an owner-info ConfigMap for the Greenhouse owner-info datasource.
extraManifests: []
